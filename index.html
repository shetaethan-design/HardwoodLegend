<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoop Dynasty — carrière NBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wood:#C9922E;
    --wood-dark:#A66E1E;
    --navy:#152238;
    --navy-2:#1F3253;
    --red:#C8372F;
    --paper:#F6F1E4;
    --paper-2:#EDE5D0;
    --ink:#1C1A16;
    --ink-2:#6B6558;
    --line:#D9CCA8;
    --gold:#E3B23C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px, transparent 1px, transparent 64px);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px;}
  .masthead{
    display:flex;align-items:flex-end;justify-content:space-between;
    border-bottom:4px solid var(--navy);
    padding-bottom:10px;margin-bottom:6px;
  }
  .masthead h1{
    font-family:'Anton',sans-serif;
    font-size:38px;letter-spacing:0.5px;
    color:var(--navy);margin:0;text-transform:uppercase;
    line-height:0.95;
  }
  .masthead .tag{
    font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:2px;
    color:var(--ink-2);text-transform:uppercase;
  }
  .court-rule{
    height:10px;position:relative;margin-bottom:26px;
    background: linear-gradient(var(--wood), var(--wood));
    border-top:2px solid var(--wood-dark);border-bottom:2px solid var(--wood-dark);
  }
  .court-rule::after{
    content:"";position:absolute;left:50%;top:-6px;width:1px;height:22px;
    background:var(--wood-dark);
  }
  .card{
    background:#fff;border:1px solid var(--line);border-radius:2px;
    padding:22px 24px;margin-bottom:18px;
    box-shadow:0 1px 0 var(--line);
  }
  .eyebrow{
    font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:2px;
    text-transform:uppercase;color:var(--red);font-weight:600;margin:0 0 6px;
  }
  h2{
    font-family:'Anton',sans-serif;font-weight:400;font-size:24px;
    color:var(--navy);margin:0 0 12px;text-transform:uppercase;letter-spacing:0.3px;
  }
  h3{
    font-family:'Oswald',sans-serif;font-size:15px;color:var(--navy);
    margin:18px 0 8px;text-transform:uppercase;letter-spacing:0.5px;
  }
  p{line-height:1.55;margin:0 0 12px;color:var(--ink);}
  .muted{color:var(--ink-2);font-size:14px;}
  label{
    display:block;font-family:'Oswald',sans-serif;font-size:12px;
    letter-spacing:1px;text-transform:uppercase;color:var(--ink-2);
    margin:14px 0 5px;
  }
  input[type=text], select{
    width:100%;padding:10px 12px;font-size:15px;font-family:'Inter',sans-serif;
    border:1px solid #C9BFA0;border-radius:2px;background:var(--paper);color:var(--ink);
  }
  .choice-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
  .choice-row.single{grid-template-columns:1fr;}
  .choice-btn{
    text-align:left;border:1px solid #C9BFA0;background:var(--paper);
    padding:12px 14px;border-radius:2px;cursor:pointer;font-family:'Inter',sans-serif;
    font-size:14px;color:var(--ink);transition:border-color .12s, background .12s;
  }
  .choice-btn:hover{border-color:var(--navy);background:#fff;}
  .choice-btn.selected{border-color:var(--navy);background:var(--navy);}
  .choice-btn.selected .opt-title{color:var(--gold);}
  .choice-btn.selected .opt-sub{color:#C9D3E4;}
  .choice-btn.selected .opt-title::before{content:"✓ ";}
  .choice-btn:disabled{opacity:0.55;cursor:default;}
  .flag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;}
  .flag-btn{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    border:1px solid #C9BFA0;background:var(--paper);padding:14px 8px;border-radius:2px;cursor:pointer;
  }
  .flag-btn .fl{font-size:28px;line-height:1;}
  .flag-btn .fn{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:0.5px;text-transform:uppercase;color:var(--navy);text-align:center;}
  .flag-btn:hover{border-color:var(--navy);}
  .flag-btn.selected{border-color:var(--navy);background:var(--navy);}
  .flag-btn.selected .fn{color:#fff;}
  .legend-card{
    display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:2px;
    padding:10px 12px;margin-bottom:8px;background:var(--paper-2);
  }
  .legend-card .lname{font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;color:var(--navy);text-transform:uppercase;}
  .legend-card .lmeta{font-size:12px;color:var(--ink-2);}
  .retired-jersey{
    text-align:center;background:var(--navy);border:3px solid var(--gold);border-radius:6px;
    padding:22px 16px;margin:14px 0;position:relative;overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .retired-jersey::before{
    content:"🎉";position:absolute;top:8px;left:12px;font-size:18px;opacity:0.5;
  }
  .retired-jersey::after{
    content:"🎉";position:absolute;top:8px;right:12px;font-size:18px;opacity:0.5;
  }
  .retired-jersey .rnum{font-family:'Anton',sans-serif;font-size:56px;color:var(--gold);line-height:1;text-shadow:0 2px 0 rgba(0,0,0,0.3);}
  .retired-jersey .rlabel{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#C9D3E4;margin-top:4px;}
  .retired-jersey .rteam{font-family:'Anton',sans-serif;font-size:17px;color:#fff;text-transform:uppercase;margin-top:6px;}
  .badge-locked{background:#fff;color:var(--ink-2);border:1.5px dashed #C9BFA0;cursor:pointer;}
  .badge-locked:hover{background:var(--paper-2);border-color:var(--navy);}
  .trophy-card{
    background:linear-gradient(135deg, var(--navy), var(--navy-2));
    border:3px solid var(--gold); border-radius:8px; padding:20px; margin:14px 0; color:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .trophy-card h3{color:var(--gold);margin-top:0;}
  .trophy-card .tc-name{font-family:'Anton',sans-serif;font-size:22px;text-transform:uppercase;}
  .trophy-card .tc-sub{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:1px;color:#C9D3E4;text-transform:uppercase;margin-bottom:8px;}
  .trophy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
  .trophy-item{text-align:center;}
  .trophy-item .tv{font-family:'Anton',sans-serif;font-size:22px;color:var(--gold);}
  .trophy-item .tl{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:0.8px;text-transform:uppercase;color:#C9D3E4;}
  .verdict-good{border-left:5px solid #2E8B57;background:#EAF7EE;}
  .verdict-bad{border-left:5px solid #C8372F;background:#FCEBEA;}
  .verdict-good .eyebrow{color:#1F6B41;}
  .verdict-bad .eyebrow{color:#A8261F;}
  .choice-btn .opt-title{font-weight:700;display:block;margin-bottom:3px;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:12.5px;letter-spacing:0.5px;color:var(--navy);}
  .choice-btn .opt-sub{color:var(--ink-2);font-size:13px;}
  .btn-primary{
    display:inline-block;background:var(--navy);color:#fff;border:none;
    font-family:'Oswald',sans-serif;letter-spacing:1px;text-transform:uppercase;
    font-size:13px;padding:12px 22px;border-radius:2px;cursor:pointer;margin-top:6px;
  }
  .btn-primary:hover{background:var(--navy-2);}
  .btn-ghost{
    display:inline-block;background:transparent;color:var(--navy);
    border:1px solid var(--navy);font-family:'Oswald',sans-serif;letter-spacing:1px;
    text-transform:uppercase;font-size:13px;padding:11px 20px;border-radius:2px;
    cursor:pointer;margin-top:6px;margin-left:8px;
  }
  .btn-ghost:hover{background:var(--paper-2);}
  .id-card{
    display:flex;gap:10px;align-items:center;background:var(--navy);
    color:#fff;border-radius:3px;padding:8px 14px;margin-bottom:14px;
  }
  .jersey-num{
    font-family:'Anton',sans-serif;font-size:18px;color:var(--gold);
    line-height:1;
  }
  .id-meta{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .id-meta .name{font-family:'Oswald',sans-serif;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;}
  .id-meta .sub{font-family:'Oswald',sans-serif;font-size:11px;color:#C9D3E4;letter-spacing:0.5px;text-transform:uppercase;}
  .stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0;}
  .stat-box{background:var(--paper-2);border-radius:2px;padding:10px 6px;text-align:center;}
  .stat-box .v{font-family:'Anton',sans-serif;font-size:20px;color:var(--navy);}
  .stat-box .l{font-family:'Oswald',sans-serif;font-size:9.5px;letter-spacing:1px;color:var(--ink-2);text-transform:uppercase;}
  table.boxscore{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px;}
  table.boxscore th{
    text-align:left;font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:1px;
    text-transform:uppercase;color:var(--ink-2);border-bottom:2px solid var(--navy);padding:6px 4px;
  }
  table.boxscore td{padding:6px 4px;border-bottom:1px solid var(--line);}
  .badge{
    display:inline-block;font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:0.5px;
    text-transform:uppercase;padding:3px 9px;border-radius:20px;margin:2px 4px 2px 0;
  }
  .badge-gold{background:#FBEAC7;color:#7A5205;}
  .badge-red{background:#FADAD8;color:#7A211C;}
  .badge-navy{background:#DDE4F0;color:var(--navy);}
  .event-box{border-left:3px solid var(--red);background:#FCF6EC;padding:12px 14px;margin:10px 0;}
  .center{text-align:center;}
  .final-hero{
    text-align:center;padding:30px 10px;background:var(--navy);color:#fff;border-radius:3px;margin-bottom:20px;
  }
  .final-hero .hof{font-family:'Anton',sans-serif;font-size:30px;color:var(--gold);text-transform:uppercase;}
  .final-hero .sub{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:1px;color:#C9D3E4;text-transform:uppercase;margin-top:6px;}
  footer{text-align:center;color:var(--ink-2);font-size:12px;margin-top:30px;}
  .progress-track{height:5px;background:var(--paper-2);border-radius:4px;overflow:hidden;margin-bottom:6px;}
  .progress-fill{height:100%;background:var(--wood);}
  .status-bar{
    display:none; gap:8px; flex-wrap:wrap; justify-content:space-between; background:var(--navy); color:#fff;
    border-radius:3px; padding:10px 14px; margin-bottom:16px; position:sticky; top:8px; z-index:5;
    box-shadow:0 2px 6px rgba(0,0,0,0.15); transition:border-left-color .2s;
  }
  .status-bar .stat{ flex:1; min-width:64px; text-align:center; font-family:'Oswald',sans-serif; font-size:9.5px; letter-spacing:0.8px; text-transform:uppercase; color:#C9D3E4; }
  .status-bar .stat .sv{ font-family:'Anton',sans-serif; font-size:15px; color:var(--gold); letter-spacing:1px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Hoop Dynasty</h1>
    <div class="tag">Sim de carrière NBA</div>
  </div>
  <div class="court-rule"></div>
  <div id="langSwitcher"></div>
  <div id="statusBar" class="status-bar"></div>
  <div id="app"></div>
  <footer>De la rue au Hall of Fame — chaque choix compte, sur le terrain et en dehors.</footer>
</div>

<script>
const POSITIONS = [
  {id:'PG', label:'Meneur (PG)', emoji:'🧠'},
  {id:'SG', label:'Arrière (SG)', emoji:'🎯'},
  {id:'SF', label:'Ailier (SF)', emoji:'🦅'},
  {id:'PF', label:'Ailier fort (PF)', emoji:'💪'},
  {id:'C',  label:'Pivot (C)', emoji:'🗼'}
];
const POSITIONS_LABEL_EN = {PG:'Point Guard (PG)', SG:'Shooting Guard (SG)', SF:'Small Forward (SF)', PF:'Power Forward (PF)', C:'Center (C)'};
function posLabel(id){ return LANG==='en' ? (POSITIONS_LABEL_EN[id]||id) : (POSITIONS.find(p=>p.id===id)||{}).label; }
function archLabel(id){ return LANG==='en' ? (ARCHETYPES_EN[id]||{}).label : (ARCHETYPES[id]||{}).label; }
const ARCHETYPES = {
  scorer:{label:'Pur scoreur', sub:'+ scoring de départ, defense plus faible', base:{scoring:62,playmaking:45,defense:42,rebounding:44,athleticism:52}},
  playmaker:{label:'Meneur de jeu', sub:'+ playmaking de départ', base:{scoring:48,playmaking:64,defense:46,rebounding:38,athleticism:50}},
  defender:{label:'Verrou défensif', sub:'+ defense de départ, scoring plus faible', base:{scoring:40,playmaking:44,defense:64,rebounding:52,athleticism:54}},
  athlete:{label:'Athlète explosif', sub:'+ athleticism, profil brut à polir', base:{scoring:50,playmaking:40,defense:48,rebounding:48,athleticism:66}},
  sniper:{label:'Sniper de loin', sub:'+ adresse extrême, physique et défense en retrait', base:{scoring:66,playmaking:38,defense:36,rebounding:34,athleticism:44}},
  anchor:{label:'Pilier défensif intérieur', sub:'+ défense et rebond, jeu extérieur limité', base:{scoring:36,playmaking:32,defense:62,rebounding:64,athleticism:50}},
  combo:{label:'Combo guard polyvalent', sub:'Équilibré scoring/playmaking, aucun point faible marqué', base:{scoring:54,playmaking:54,defense:48,rebounding:38,athleticism:52}},
  stretch:{label:'Intérieur shooteur', sub:'+ adresse extérieure pour un profil de grand, rebond en retrait', base:{scoring:56,playmaking:36,defense:50,rebounding:46,athleticism:42}}
};
const ARCHETYPES_EN = {
  scorer:{label:'Pure Scorer', sub:'+ starting scoring, weaker defense'},
  playmaker:{label:'Playmaker', sub:'+ starting playmaking'},
  defender:{label:'Defensive Lockdown', sub:'+ starting defense, weaker scoring'},
  athlete:{label:'Explosive Athlete', sub:'+ athleticism, raw profile to refine'},
  sniper:{label:'Deep Range Sniper', sub:'+ elite shooting touch, lower physicality and defense'},
  anchor:{label:'Interior Defensive Anchor', sub:'+ defense and rebounding, limited outside game'},
  combo:{label:'Versatile Combo Guard', sub:'Balanced scoring/playmaking, no glaring weakness'},
  stretch:{label:'Stretch Big', sub:'+ outside shooting for a big man profile, lighter rebounding'}
};
const TEAMS = ['Boston','Los Angeles Lakers','Los Angeles Clippers','Miami','Chicago','New York','Brooklyn','Dallas','Denver','Phoenix','Golden State','Milwaukee','Memphis','Toronto','Orlando','Portland','Minnesota','Atlanta','Philadelphie','Cleveland','Indiana','Detroit','Charlotte','Washington','San Antonio','Houston','Oklahoma City','Utah','Sacramento','New Orleans'];
const TEAM_COLORS = {
  'Boston':'#0C7B4A','Los Angeles Lakers':'#5A2D81','Los Angeles Clippers':'#C8102E','Miami':'#98002E','Chicago':'#CE1141','New York':'#F58426',
  'Brooklyn':'#000000','Dallas':'#00538C','Denver':'#4D90CD','Phoenix':'#E56020','Golden State':'#FFC72C','Milwaukee':'#00471B',
  'Memphis':'#5D76A9','Toronto':'#CE1141','Orlando':'#0057B8','Portland':'#E03A3E','Minnesota':'#236192','Atlanta':'#E03A3E',
  'Philadelphie':'#006BB6','Cleveland':'#860038','Indiana':'#FDBB30','Detroit':'#C8102E','Charlotte':'#1D1160','Washington':'#002B5C',
  'San Antonio':'#C4CED4','Houston':'#CE1141','Oklahoma City':'#007AC1','Utah':'#002B5C','Sacramento':'#5A2D81','New Orleans':'#0C2340'
};

// ---------- RIVAL & STAFF (entraîneur / front office) ----------
const RIVAL_FIRST = ['Marcus','Jalen','Andre','Tyrese','DeShawn','Xavier','Isaiah','Trey','Malik','Cole','Jordan','Elijah','Darius','Antoine','Corey','Julian'];
const RIVAL_LAST = ['Coleman','Whitfield','Bryant','Okafor','Sanders','Reyes','Thornton','Baptiste','Grant','Delgado','Mercer','Voss','Ellison','Marchetti','Boakye','Sinclair'];
const COACH_NAMES = ['Marty Kowalski','Dennis Ferrara','Raymond Okoro','Steve Halloran','Phil Vaccaro','Kevin DeLuca','Nate Whitmore','Carlos Fenwick','Greg Aldana','Bruce Sillman','Tony Marchetti','Darnell Osei','Frank Lindqvist','Ray Bertucci'];

function generateRival(){
  return {
    name: `${RIVAL_FIRST[rand(0,RIVAL_FIRST.length-1)]} ${RIVAL_LAST[rand(0,RIVAL_LAST.length-1)]}`,
    team: TEAMS[rand(0,TEAMS.length-1)],
    ov: clamp(overall(S.ratings) + rand(-8,8), 40, 90),
    ppg: 12, mvps:0, champs:0, allStars:0, dpoys:0
  };
}

function generateDraftClass(){
  return [generateRival(), generateRival(), generateRival()];
}

function generateCoach(){
  return {name: COACH_NAMES[rand(0,COACH_NAMES.length-1)], trust: rand(45,65)};
}

// ---------- ORIGIN, ENTOURAGE, HYGIÈNE DE VIE ----------
const BACKGROUNDS = {
  quartier: {
    label:'Enfant du quartier', sub:"Terrains extérieurs, débrouille et instinct de rue dès le plus jeune âge",
    stat:{scoring:2,playmaking:1,defense:1,rebounding:1,athleticism:3},
    confidence:65, money:0, draftStock:0, legacy:5
  },

  bigagent: {label:'Big Agency', sub:"A powerful agent negotiates every contract and endorsement for you"},

  solo: {label:'Independent Agent', sub:"You handle the big decisions yourself, backed by a discreet agent"}

const LIFESTYLES = {
  strict: {
    label:'Discipline stricte', sub:"Sommeil, nutrition, zéro excès — le corps d'abord",
    injuryMod:0.5, agingMod:-1, confVolatility:0.6, legacyBonus:0
  },
  balanced: {

  }
};
const LIFESTYLES_EN = {
  strict: {label:'Strict Discipline', sub:"Sleep, nutrition, zero excess — the body comes first"},
  balanced: {label:'Balanced Lifestyle', sub:"A bit of everything, no excess"},
  party: {label:'Superstar Mode', sub:"Nights out, public image, and nightlife fully embraced"}
};

const NATIONALITIES = [
  {name:'États-Unis', flag:'🇺🇸'}, {name:'France', flag:'🇫🇷'}, {name:'Belgique', flag:'🇧🇪'},
  {name:'Espagne', flag:'🇪🇸'}, {name:'Serbie', flag:'🇷🇸'}, {name:'Nigeria', flag:'🇳🇬'},
  {name:'Australie', flag:'🇦🇺'}, {name:'Canada', flag:'🇨🇦'}, {name:'Grèce', flag:'🇬🇷'},
  {name:'Slovénie', flag:'🇸🇮'}, {name:'Argentine', flag:'🇦🇷'}, {name:'Cameroun', flag:'🇨🇲'},

function localize(obj, dict){
  if(LANG==='en' && dict && dict[obj.id]){
    const tr = dict[obj.id];
    const patch = {};
    if(tr.title!==undefined) patch.title = tr.title;
    if(tr.label!==undefined) patch.label = tr.label;
    if(tr.sub!==undefined) patch.sub = tr.sub;
    return {...obj, ...patch};
  }
  return obj;
}
function localizeList(list, dict){ return list.map(o=> localize(o, dict)); }
function localizeObj(objMap, dict){
  const out = {};
  Object.keys(objMap).forEach(k=> out[k] = localize({...objMap[k], id:k}, dict));
  return out;
}

function pickActions(n){
  const pool = [...ACTIONS];
  for(let i=pool.length-1;i>0;i--){ const j=rand(0,i); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return localizeList(pool.slice(0,n), ACTIONS_EN);
}

function resolveGenericAction(action, opp){
  const r = S.ratings;
  const statVal = r[action.stat] + (action.stat2 ? r[action.stat2]*0.4 : 0);
  const oppAdj = opp ? (opp.quality-55)*0.35 : 0;
  let chance = clamp((statVal*(action.stat2?0.78:0.92) + S.confidence*0.22 - oppAdj)/165, 0.1, 0.72);
  if(action.risk==='high') chance -= 0.09; else if(action.risk==='low') chance += 0.04;
  const success = Math.random() < chance;
  const swings = action.risk==='high' ? [8,16,8,18] : action.risk==='medium' ? [5,10,5,12] : [3,6,3,7];
  if(success){
    bumpConfidence(rand(swings[0],swings[1]));
    S.teamQuality = clamp(S.teamQuality + rand(2,6), 20, 95);
    S._seasonBonus = (S._seasonBonus||0) + rand(1,3);
  } else {
    bumpConfidence(-(Math.round(rand(swings[2],swings[3])*LIFESTYLES[S.lifestyle].confVolatility)));
    S.teamQuality = clamp(S.teamQuality - rand(2,5), 20, 95);
    const badLuckChance = action.risk==='high' ? 0.3 : action.risk==='medium' ? 0.2 : 0.08;
    if(Math.random() < badLuckChance){
      S.ratings[action.stat] = clamp(S.ratings[action.stat] - rand(1,3), 20, 99);
      S._gamesLostThisSeason = (S._gamesLostThisSeason||0) + rand(1,4);
    }
  }
  return success;
}

function judgeOutcome(before){
  const dConf = S.confidence - before.confidence;
  const dLegacy = S.legacy - before.legacy;
  const dMoney = Math.round((S.finance.careerEarnings - before.money)*10)/10;
  const score = dConf + dLegacy*1.5 + dMoney*3;
  const goodPool = LANG==='en' ? GOOD_VERDICT_TEXTS_EN : GOOD_VERDICT_TEXTS;
  const badPool = LANG==='en' ? BAD_VERDICT_TEXTS_EN : BAD_VERDICT_TEXTS;
  const verdict = score >= 0
    ? {good:true, label: LANG==='en' ? '✔ Good Choice' : '✔ Bon choix', text: goodPool[rand(0,goodPool.length-1)]}
    : {good:false, label: LANG==='en' ? '✘ Bad Choice' : '✘ Mauvais choix', text: badPool[rand(0,badPool.length-1)]};
  verdict.dMoney = dMoney;
  return verdict;
}

// ---------- STOCKAGE PERSISTANT (polyfill localStorage) ----------
// Reproduit fidèlement l'API window.storage (get/set/delete/list) attendue par le reste du code,
// mais s'appuie sur localStorage pour fonctionner en dehors de l'environnement Claude Artifacts.
// Le paramètre "shared" est accepté pour compatibilité mais n'a pas d'effet réel ici : sans serveur,
// il n'y a pas de vraie donnée partagée entre joueurs — tout reste local à l'appareil du joueur.
(function(){
  const PREFIX = 'hwlegend:';
  if(!window.storage){
    window.storage = {
      async get(key, shared){
        try{
          const raw = localStorage.getItem(PREFIX + key);
          if(raw === null || raw === undefined) return null;
          return {key, value: raw, shared: !!shared};
        }catch(e){ return null; }
      },
      async set(key, value, shared){
        try{
          localStorage.setItem(PREFIX + key, value);
          return {key, value, shared: !!shared};
        }catch(e){ return null; }
      },
      async delete(key, shared){
        try{
          localStorage.removeItem(PREFIX + key);
          return {key, deleted:true, shared: !!shared};
        }catch(e){ return null; }
      },
      async list(prefix, shared){
        try{
          const keys = [];
          const fullPrefix = PREFIX + (prefix||'');
          for(let i=0;i<localStorage.length;i++){
            const k = localStorage.key(i);
            if(k && k.indexOf(fullPrefix)===0){ keys.push(k.slice(PREFIX.length)); }
          }
          return {keys, prefix, shared: !!shared};
        }catch(e){ return null; }
      }
    };
  }
})();

// Morale is deliberately harder to build up than to lose: gains are dampened, losses amplified.
function bumpConfidence(delta){
  const mult = delta > 0 ? 0.7 : 1.1;
  S.confidence = clamp(S.confidence + delta*mult, 0, 100);
}

// en pleine confiance sur le terrain tout en étant décrié dans les médias, et inversement.
function bumpReputation(delta){
  if(S.reputation === undefined) S.reputation = 55;
  S.reputation = clamp(S.reputation + delta, 0, 100);
}

// ---------- PROJECTION DE DRAFT ----------
// Calcule un pick de draft réaliste : une "qualité" composite (niveau + bonus) est convertie
// en position de draft avec une vraie répartition en cloche, plutôt qu'un empilement au pick n°1.
function computeDraftPick(extraQuality){
  const ov = overall(S.ratings);
  const quality = ov + extraQuality;
  const base = 58 - (quality - 36) * 1.6;
  return clamp(Math.round(base + rand(-9,9)), 1, 60);
}

function screenDraftProjection(){
  const ov = overall(S.ratings);
  const collegeBoost = S.collegeStats ? Math.round((S.collegeStats.points-14)/2.5) : 0;
  const extraQuality = S.draftStock*0.7 + collegeBoost*1.4;
  const N = 800;
  let lottery=0, firstRound=0, secondRound=0;
  for(let i=0;i<N;i++){
    const p = computeDraftPick(extraQuality);
    if(p<=14) lottery++; else if(p<=30) firstRound++; else secondRound++;
  }
  const pctLottery = Math.round(100*lottery/N);
  const pctFirst = Math.round(100*firstRound/N);
  const pctSecond = 100 - pctLottery - pctFirst;
  const copy = LANG==='en' ? {
    eyebrow:'Draft Projection', title:'Where Will You Get Picked?',
    desc:"Based on your current level and preparation, here are your estimated odds for draft night.",
    lottery:'🎯 Lottery (picks 1-14)', first:'1st round (15-30)', second:'2nd round (31-60)'
  } : {
    eyebrow:'Projection de draft', title:'Où vas-tu être sélectionné ?',
    desc:"D'après ton niveau actuel et ta préparation, voici tes chances estimées pour la draft night.",
    lottery:'🎯 Loterie (picks 1-14)', first:'1er tour (15-30)', second:'2e tour (31-60)'
  };
  app.innerHTML = `
  <div class="card">
    <p class="eyebrow">${copy.eyebrow}</p>
    <h2>${copy.title}</h2>
    <p class="muted">${copy.desc}</p>
    <table class="boxscore">
      <tr><th>${copy.lottery}</th><th>${copy.first}</th><th>${copy.second}</th></tr>
      <tr><td>${pctLottery}%</td><td>${pctFirst}%</td><td>${pctSecond}%</td></tr>
    </table>
    <button class="btn-primary" id="draftRevealBtn" style="margin-top:10px;">${t('discoverFate')}</button>
  </div>`;
  document.getElementById('draftRevealBtn').addEventListener('click', screenDraft);
}

const MAX_SALARY = 55; // plafond réaliste façon supermax NBA (en M$/an)

function rookieContract(pick){
  let salary, years;
  if(pick<=5){ salary = rand(80,110)/10; years = 4; }
  else if(pick<=14){ salary = rand(50,79)/10; years = 4; }
  else if(pick<=30){ salary = rand(20,49)/10; years = 4; }
  else { salary = rand(8,18)/10; years = 2; }
  return {salary, years};
}

function screenDraft(){
  const ov = overall(S.ratings);
  const collegeBoost = S.collegeStats ? Math.round((S.collegeStats.points-14)/2.5) : 0;
  const pick = computeDraftPick(S.draftStock*0.7 + collegeBoost*1.4);
  S.draftPick = pick;

  if(pick >= 50){
    screenDraftPathChoice(pick);

const POSITION_AGING_CURVE = {
  PG: {peakEnd:29, declineStart:31, declineMult:0.85},
  SG: {peakEnd:28, declineStart:30, declineMult:0.95},
  SF: {peakEnd:27, declineStart:29, declineMult:1.0},
  PF: {peakEnd:26, declineStart:28, declineMult:1.15},
  C:  {peakEnd:25, declineStart:27, declineMult:1.3}
};

function applyTraining(focus){
  const age = S.age;
  const curve = POSITION_AGING_CURVE[S.position] || POSITION_AGING_CURVE.SF;
  let growthPhase;
  if(age <= 23) growthPhase = Math.random() < 0.15 ? rand(-2,1) : rand(4,7);
  else if(age <= curve.peakEnd) growthPhase = Math.random() < 0.12 ? rand(-2,1) : rand(2,4);
  else if(age <= curve.declineStart) growthPhase = rand(-1,2);
  else growthPhase = (-rand(3,7) - Math.round(Math.max(0, age-curve.declineStart)*1.3)) * curve.declineMult;
  growthPhase -= LIFESTYLES[S.lifestyle].agingMod;

  Object.keys(S.ratings).forEach(k=>{
    let delta = Math.round(growthPhase * (k===focus ? 1.6 : 0.5));
    delta += rand(-1,1);
    S.ratings[k] = clamp(S.ratings[k] + delta, 20, 99);
  });

  proceedAfterTraining();
}

function proceedAfterTraining(){
  if(S.season >= (S.nextInternationalSeason||2) && S.age < 37){
    const ov = overall(S.ratings);
    const selectionChance = clamp((ov-38)/50, 0.2, 0.92);
    if(Math.random() < selectionChance){
      screenInternational();
    } else {
      screenNotSelected();
    }
  } else {
    proceedToCareerAction();
  }
}

      ${actions.map(a=>`
        <button class="choice-btn" data-id="${a.id}">
          <span class="opt-title">${a.title}</span>
          <span class="opt-sub">${a.sub}</span>
        </button>`).join('')}
    </div>
  </div>`;
  const row = document.getElementById('intlActionRow');
  row.querySelectorAll('.choice-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const action = actions.find(a=>a.id===b.dataset.id);
      selectAndProceed(row, b, ()=>{
        const success = resolveGenericAction(action, opp);
        if(success) S._intl.wins += 1;
        S._intl.stage += 1;
        screenActionOutcome(action, success, ()=>{
          if(S._intl.stage < 2) screenInternationalAction(); else finalizeInternational();
        });
      }, 90);
    });
  });
}

function finalizeInternational(){
  const type = S._intl.type;
  const ov = overall(S.ratings);
  let medal = 'none';
  if(S._intl.wins===2 && Math.random() < clamp(0.35 + (ov-70)/200, 0.15, 0.75)) medal = 'or';
  else if(S._intl.wins>=1 && Math.random() < 0.55) medal = Math.random() < 0.5 ? 'argent' : 'bronze';

  if(medal==='or'){
    S.legacy += 15; bumpConfidence(12);
    if(type==='cdm') S.awards.worldCupGold += 1; else S.awards.olympicGold += 1;
  } else if(medal==='argent' || medal==='bronze'){
    S.legacy += 8; bumpConfidence(6);
    if(type==='cdm') S.awards.worldCupMedal += 1; else S.awards.olympicMedal += 1;
  } else {
    bumpConfidence(-(4));
  }

  if(Math.random() < 0.3){
    S._gamesLostThisSeason = (S._gamesLostThisSeason||0) + rand(3,8);
  }

  const compLabel = LANG==='en'
    ? (type==='cdm' ? 'FIBA World Cup' : 'Olympic Games')
    : (type==='cdm' ? 'Coupe du Monde FIBA' : 'Jeux Olympiques');
  const copy = LANG==='en' ? {
    eyebrow:'International Campaign Recap',
    gold:'🥇 Gold Medal', silver:'🥈 Silver Medal', bronze:'🥉 Bronze Medal', none:'No medal this time',
    desc:(w,n)=>`${w}/2 decisive games won wearing the ${n} jersey.`,
    returnBtn:'Return to the NBA'
  } : {
    eyebrow:'Bilan de la campagne internationale',
    gold:"🥇 Médaille d'or", silver:"🥈 Médaille d'argent", bronze:'🥉 Médaille de bronze', none:'Pas de médaille cette fois',
    desc:(w,n)=>`${w}/2 matchs décisifs remportés sous le maillot de ${n}.`,
    returnBtn:'Retour à la NBA'
  };
  const medalLabel = medal==='or' ? copy.gold : medal==='argent' ? copy.silver : medal==='bronze' ? copy.bronze : copy.none;
  app.innerHTML = `
  ${renderIdCard(`${S.nationality} · ${compLabel}`)}
  <div class="card">
    <p class="eyebrow">${copy.eyebrow}</p>
    <h2>${medalLabel}</h2>
    <p class="muted">${copy.desc(S._intl.wins, S.nationality)}</p>
    ${renderConfidenceBar()}
    <button class="btn-primary" id="intlContinueBtn">${copy.returnBtn}</button>
  </div>`;
  document.getElementById('intlContinueBtn').addEventListener('click', ()=>{
    advanceInternationalCycle();
    proceedToCareerAction();
  });
}

function advanceInternationalCycle(){
  S.nextInternationalSeason = S.season + 3;
  S.nextInternationalType = S.nextInternationalType==='cdm' ? 'jo' : 'cdm';
}

function screenCareerAction(){
  currentRender = screenCareerAction;
  const options = [];

  options.push({
    id:'focus', title:'Rester focus sur le jeu', sub:'Aucun à-côté cette intersaison, 100% concentré sur le terrain',
    effect:(S)=>{ Object.keys(S.ratings).forEach(k=> S.ratings[k]=clamp(S.ratings[k]+rand(0,2),20,99)); bumpConfidence(rand(1,4)); }
  });

  if(S.season >= 2){
    options.push({
      id:'captain', title:'Devenir le leader vestiaire', sub:'Tu prends les commandes du groupe, chimie d\u2019équipe en hausse... ou tensions internes',
      effect:(S)=>{
        if(Math.random() < 0.72){ S.teamQuality = clamp(S.teamQuality + rand(4,9), 20, 96); S.legacy += 2; if(S.coach) S.coach.trust = clamp(S.coach.trust+6,0,100); }
        else {
          S.teamQuality = clamp(S.teamQuality - rand(4,10), 20, 96);
          bumpConfidence(-(rand(3,7)));
          S.ratings.playmaking = clamp(S.ratings.playmaking - rand(0,2), 20, 99);
          if(S.coach) S.coach.trust = clamp(S.coach.trust-5,0,100);
        }
      }
    });
  }

  if(S.finance.careerEarnings >= 2){
    options.push({
      id:'invest', title: LANG==='en' ? 'Invest Off the Court' : 'Investir hors-terrain',
      sub: LANG==='en'
        ? `Put ${fmtMoney(Math.min(2, Math.round(S.finance.careerEarnings*0.2*10)/10))} into a business, passive income every season`
        : `Place ${fmtMoney(Math.min(2, Math.round(S.finance.careerEarnings*0.2*10)/10))} dans une affaire, revenu passif chaque saison`,
      effect:(S)=>{
        const stake = Math.min(2, Math.round(S.finance.careerEarnings*0.2*10)/10);
        S.finance.careerEarnings = Math.round((S.finance.careerEarnings - stake)*10)/10;
        S.finance.investmentIncome = Math.round((S.finance.investmentIncome + stake*0.35)*10)/10;
      }
    });
  }

  options.push({
    id:'charity', title:'Lancer une fondation caritative', sub:'Un don réel et proportionnel à ta fortune, gros impact sur ta réputation et ta cote auprès du front office',
    effect:(S)=>{
      const donation = Math.min(3, Math.max(0.5, Math.round(S.finance.careerEarnings*0.08*10)/10));
      S.finance.careerEarnings = Math.max(0, Math.round((S.finance.careerEarnings-donation)*10)/10);
      S.legacy += 8;
      S.gmTrust = clamp(S.gmTrust+6,0,100);
      bumpReputation(rand(4,9));
    }
  });

  if(S.season >= 2){
    options.push({
      id:'trade_request', title:'Annoncer publiquement ta demande de transfert', sub:'Sortie médiatique en grande pompe — soutien massif des fans ou bad buzz retentissant',
      teamChange:true,
      effect:(S)=>{
        S.team = TEAMS[rand(0,TEAMS.length-1)];
        S.teamQuality = clamp(rand(30,80), 20, 95);
        S.teamsPlayedFor += 1;
        if(Math.random() < 0.5){ S.legacy += 6; bumpConfidence(rand(4,8)); }
        else { bumpConfidence(-(rand(5,10))); S.legacy = Math.max(0, S.legacy-3); }
      }
    });
  }

  options.push({
    id:'change_number', title:'Changer de numéro de maillot', sub:'Tourner symboliquement une page de ta carrière', numberChange:true
  });

  options.push({
    id:'rest', title:'Prendre une vraie coupure', sub:'Zéro basket cet été, tu te ressources totalement',
    effect:(S)=>{ bumpConfidence(rand(6,11)); Object.keys(S.ratings).forEach(k=> S.ratings[k]=clamp(S.ratings[k]-rand(0,1),20,99)); }
  });

  if(S.season === 1){
    options.push({
      id:'rookie_summer_league', title:'Briller en Summer League', sub:'Ta première vraie vitrine pro — de quoi rassurer le front office ou inquiéter tout le monde',
      effect:(S)=>{
        if(Math.random() < 0.65){
          Object.keys(S.ratings).forEach(k=> S.ratings[k]=clamp(S.ratings[k]+rand(0,2),20,99));
          bumpConfidence(rand(4,8));
          S.gmTrust = clamp(S.gmTrust+5,0,100);
        } else {
          bumpConfidence(-(rand(3,7)));
          S.gmTrust = clamp(S.gmTrust-4,0,100);
        }
      }
    });
  }

  options.push({
    id:'clinic', title:'Organiser un camp basket pour les jeunes', sub:'Tu redonnes à la communauté — belle image, coûte du temps et un peu d\u2019argent',
    effect:(S)=>{
      S.finance.careerEarnings = Math.max(0, Math.round((S.finance.careerEarnings-0.3)*10)/10);
      S.legacy += 6;
      bumpConfidence(rand(2,5));
      S.gmTrust = clamp(S.gmTrust+4,0,100);
    }
  });

  if(S.season >= 4 && S.age >= 23){
    options.push({
      id:'mentor_rookie', title:'Prendre un jeune coéquipier sous ton aile', sub:'Tu l\u2019aides à progresser, la chimie d\u2019équipe en profite... si le courant passe',
      effect:(S)=>{
        if(Math.random() < 0.75){ S.teamQuality = clamp(S.teamQuality + rand(3,7), 20, 96); S.legacy += 3; }
        else { bumpConfidence(-(rand(2,5))); S.ratings.defense = clamp(S.ratings.defense - rand(0,2), 20, 99); }
      }
    });
  }

  if(computeLegacy() >= 220 && S.season >= 6){
    options.push({
      id:'superteam', title:'Former une superteam', sub:'En légende vivante, tu recrutes d\u2019autres stars — titre facilité, mais accusations de facilité et critiques garanties',
      effect:(S)=>{
        S.teamQuality = clamp(S.teamQuality + rand(18,30), 20, 96);
        if(Math.random() < 0.5){ bumpConfidence(-(rand(4,8))); S.legacy = Math.max(0, S.legacy-5); }
        else { bumpConfidence(rand(3,6)); }
      }
    });
  }

  // On ne montre jamais toute la liste : 2 ou 3 dilemmes différents à chaque fois, pour varier les intersaisons.
  const shuffled = [...options];
  for(let i=shuffled.length-1;i>0;i--){ const j=rand(0,i); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }
  const shown = shuffled.slice(0, rand(2, Math.min(3, shuffled.length)));
  const shownLocalized = localizeList(shown, CAREER_ACTIONS_EN);

  app.innerHTML = `
  ${renderIdCard(`${S.team} · ${S.age} · ${t('season')} ${S.season}`)}
  <div class="card">
    <p class="eyebrow">${t('offseason')} — ${t('careerDilemma')}</p>
    <h2>${t('careerChoiceTitle')}</h2>
    <p class="muted">${t('careerChoiceQuestion')}</p>
    <div class="choice-row single" id="careerActionRow">
      ${shownLocalized.map(o=>`
        <button class="choice-btn" data-id="${o.id}">
          <span class="opt-title">${o.title}</span>
          <span class="opt-sub">${o.sub}</span>
        </button>`).join('')}
    </div>
  </div>`;
  const row = document.getElementById('careerActionRow');
  row.querySelectorAll('.choice-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const opt = options.find(o=>o.id===b.dataset.id);
      const optLocalized = shownLocalized.find(o=>o.id===b.dataset.id);
      S.nextCareerActionSeason = S.season + rand(2,3);
      if(opt.numberChange){
        selectAndProceed(row, b, ()=> screenChangeNumber(()=> maybeRandomEvent(()=> checkMajorInjury(()=> screenClutchMoment()))));
        return;
      }
      selectAndProceed(row, b, ()=>{
        const before = {confidence:S.confidence, legacy:S.legacy, money:S.finance.careerEarnings};
        opt.effect(S);
        const verdict = judgeOutcome(before);
        const afterVerdict = opt.teamChange
          ? ()=> screenChangeNumber(()=> maybeRandomEvent(()=> checkMajorInjury(()=> screenClutchMoment())))
          : ()=> maybeRandomEvent(()=> checkMajorInjury(()=> screenClutchMoment()));
        screenChoiceVerdict(optLocalized.title, verdict, afterVerdict);
      });
    });
  });
}

function checkMajorInjury(next){
  const chance = clamp(0.11 * LIFESTYLES[S.lifestyle].injuryMod * (S.age>=31 ? 1.6 : 1), 0.035, 0.28);
  if(Math.random() < chance){
    screenMajorInjury(next);
  } else {
    next();
  }
}

function screenMajorInjury(next){
  const part = BODY_PARTS[rand(0,BODY_PARTS.length-1)];
  const copy = LANG==='en' ? {
    eyebrow:'Tough Break', title:(l)=>`Serious Injury ${l}`,
    desc:(l)=>`A medical exam reveals a serious injury ${l} that will keep you off the court for a while. How do you handle your recovery?`,
    surgeryT:'Surgery and Full Rehab', surgeryS:"You miss a lot of games, but come back with no lasting damage",
    rushT:'Come Back Sooner Than Planned', rushS:'Fewer games missed, but risk of permanent physical damage',
    rushed:'✘ Rushed Return', managed:'✔ Recovery Managed',
    surgerySuccess:'Successful Surgery', sequelaeTitle:(l)=>`Lasting Damage ${l}`, cleanReturn:'Clean Return, No Damage',
    sequelaeDesc:(l)=>`The early return leaves lasting damage on your injury ${l}.`,
    cleanDesc:"Your body responded well — the rest of your career won't suffer much."
  } : {
    eyebrow:'Coup dur', title:(l)=>`Blessure sérieuse ${l}`,
    desc:(l)=>`Un examen médical révèle une blessure sérieuse ${l} qui va t'éloigner des terrains un moment. Comment gères-tu ta convalescence ?`,
    surgeryT:'Opération et rééducation complète', surgeryS:'Tu perds beaucoup de matchs, mais reviens sans séquelle durable',
    rushT:'Revenir plus vite que prévu', rushS:'Moins de matchs manqués, mais risque de séquelles physiques permanentes',
    rushed:'✘ Retour précipité', managed:'✔ Convalescence gérée',
    surgerySuccess:'Opération réussie', sequelaeTitle:(l)=>`Séquelles ${l}`, cleanReturn:'Retour sans séquelle',
    sequelaeDesc:(l)=>`Le retour anticipé laisse des traces durables sur ta blessure ${l}.`,
    cleanDesc:"Ton corps a bien répondu — la suite de la carrière n'en pâtit pas trop."
  };
  app.innerHTML = `
  ${renderIdCard(`${S.team} · ${S.age} · ${t('season')} ${S.season}`)}
  <div class="card">
    <p class="eyebrow">${copy.eyebrow}</p>
    <h2>${copy.title(partLabel(part))}</h2>
    <p class="muted">${copy.desc(partLabel(part))}</p>
    <div class="choice-row single" id="majInjRow">
      <button class="choice-btn" data-mode="surgery"><span class="opt-title">${copy.surgeryT}</span><span class="opt-sub">${copy.surgeryS}</span></button>
      <button class="choice-btn" data-mode="rush"><span class="opt-title">${copy.rushT}</span><span class="opt-sub">${copy.rushS}</span></button>
    </div>
  </div>`;
  const row = document.getElementById('majInjRow');
  row.querySelectorAll('.choice-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      selectAndProceed(row, b, ()=>{
        S.majorInjuries += 1;
        let sequela = false;
        if(b.dataset.mode==='surgery'){
          S._gamesLostThisSeason = (S._gamesLostThisSeason||0) + rand(18,32);
          bumpConfidence(-(rand(4,8)));
        } else {
          S._gamesLostThisSeason = (S._gamesLostThisSeason||0) + rand(8,16);
          bumpConfidence(-(rand(6,12)));
          if(Math.random() < 0.5){
            sequela = true;
            applyInjuryDamage(part, rand(3,7));
          }
        }
        app.innerHTML = `
        ${renderIdCard(`${S.team} · ${S.age} · ${t('season')} ${S.season}`)}
        <div class="card">
          <p class="eyebrow">${sequela ? copy.rushed : copy.managed}</p>
          <h2>${b.dataset.mode==='surgery' ? copy.surgerySuccess : sequela ? copy.sequelaeTitle(partLabel(part)) : copy.cleanReturn}</h2>
          <p class="muted">${sequela ? copy.sequelaeDesc(partLabel(part)) : copy.cleanDesc}</p>
          ${renderConfidenceBar()}
          <button class="btn-primary" id="injContinueBtn">${t('continue')}</button>
        </div>`;
        document.getElementById('injContinueBtn').addEventListener('click', next);
      });
    });
  });
}

function maybeRandomEvent(next){
  S._gamesLostThisSeason = rand(3,14);
  if(Math.random() < 0.22 * LIFESTYLES[S.lifestyle].injuryMod){
    S._gamesLostThisSeason += rand(4,11);
  }
  let chance = 0.34;
  if(S.lifestyle==='party') chance = 0.46;
  else if(S.lifestyle==='strict') chance = 0.2;
  if(S.circle==='friends') chance += 0.06;
  chance = clamp(chance, 0.14, 0.62);

  if(Math.random() < chance){
    const ev = EVENTS[rand(0, EVENTS.length-1)];
    const frText = ev.text(S);
    const evText = (LANG==='en' && EVENTS_EN[ev.id]) ? EVENTS_EN[ev.id].text(S) : frText;
    const trA = (LANG==='en' && EVENTS_EN[ev.id]) ? EVENTS_EN[ev.id].a : null;
    const trB = (LANG==='en' && EVENTS_EN[ev.id]) ? EVENTS_EN[ev.id].b : null;
    const titleA = trA ? trA.title : ev.a.title, subA = trA ? trA.sub : ev.a.sub;
    const titleB = trB ? trB.title : ev.b.title, subB = trB ? trB.sub : ev.b.sub;
    app.innerHTML = `
    <div class="card">
      <p class="eyebrow">${t('offcourt')}</p>
      <h2>${t('eventLabel')}</h2>
      <div class="event-box"><p style="margin:0;">${evText}</p></div>
      <div class="choice-row" id="evRow">
        <button class="choice-btn" data-side="a"><span class="opt-title">${titleA}</span><span class="opt-sub">${subA}</span></button>
        <button class="choice-btn" data-side="b"><span class="opt-title">${titleB}</span><span class="opt-sub">${subB}</span></button>
      </div>
    </div>`;
    const row = document.getElementById('evRow');
    row.querySelectorAll('.choice-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        selectAndProceed(row, b, ()=>{
          const chosen = b.dataset.side==='a' ? ev.a : ev.b;
          const chosenTitle = b.dataset.side==='a' ? titleA : titleB;
          const before = {confidence:S.confidence, legacy:S.legacy, money:S.finance.careerEarnings};
          chosen.effect(S);
          const verdict = judgeOutcome(before);
          screenChoiceVerdict(chosenTitle, verdict, chosen.teamChange ? ()=> screenChangeNumber(next) : next);
        });
      });
    });
  } else {
    next();
  }
}

      const action = actions.find(a=>a.id===b.dataset.id);
      const row = document.getElementById('clutchRow');
      selectAndProceed(row, b, ()=>{
        const success = resolveGenericAction(action, S._clutchOpp);
        screenActionOutcome(action, success, simulateSeasonBase);
      }, 90);
    });
  });
}

// ---------- SIMULATE SEASON (base stats) ----------
function simulateSeasonBase(){
  const r = S.ratings;
  const ov = overall(r);
  const rookiePenalty = S.season > 2 ? 0
    : S.draftPick > 30 ? rand(30,48)
    : S.draftPick > 14 ? rand(14,28)
    : S.draftPick > 5 ? rand(4,12)
    : 0;
  // Concurrence à ton poste : un jeune qui pousse, ou un rôle qui se réduit si ton niveau ne suit plus celui de l'équipe.
  let competitionPenalty = 0;
  if(S.age >= 32){
    const competitionChance = clamp((S.age-31)*0.06, 0, 0.5);
    if(Math.random() < competitionChance) competitionPenalty += rand(6,18);
  }
  if(ov < S.teamQuality - 15 && Math.random() < 0.3){
    competitionPenalty += rand(4,12);
  }
  const games = clamp(82 - (S._gamesLostThisSeason||0) - rookiePenalty - competitionPenalty, 10, 82);
  const posBonus = {
    PG:{ast:1.5,reb:0}, SG:{ast:0.4,reb:0.2}, SF:{ast:0.3,reb:0.6},
    PF:{ast:0.1,reb:1.4,blk:0.3}, C:{ast:0,reb:1.8,blk:0.6}
  }[S.position];

  const confMult = 0.8 + (S.confidence/100)*0.35;
  const bonus = S._seasonBonus||0;
  const impact = clamp(0.55 + (S.teamQuality-50)/220, 0.45, 1.05);

  const points = clamp((Math.pow(r.scoring/99,1.2)*38 * (0.7+ov/200) + rand(-2,2) + bonus*0.6) * confMult * impact, 1, 48);
  const assists = clamp((Math.pow(r.playmaking/99,1.2)*9 + (posBonus.ast||0)*3 + rand(-1,1)*0.5) * confMult * impact, 0.2, 13.5);
  const rebounds = clamp(Math.pow(r.rebounding/99,1.15)*10 + (posBonus.reb||0)*3 + rand(-1,1)*0.5, 0.8, 15.5);
  const steals = clamp((r.defense/99)*2.1 + rand(-3,3)*0.1, 0.1, 3);
  const blocks = clamp((r.defense/99)*1.2*(1+(posBonus.blk||0)) + rand(-2,2)*0.1, 0, 3.4);

  const teamWinPct = clamp((S.teamQuality + ov*0.5)/2, 15, 88);
  const madePlayoffs = teamWinPct > 48;
  const wins = clamp(Math.round(82 * teamWinPct/100 + rand(-3,3)), 5, 78);
  const losses = 82 - wins;

  S._season = {games, points, assists, rebounds, steals, blocks, ov, teamWinPct, madePlayoffs, wins, losses};

  if(madePlayoffs){
    S.playoffRun = {round:0, stats:{games:0,points:0,rebounds:0,assists:0}, depth:0, finalsMvp:false, currentOpp:null, rounds:[]};
    screenPlayoffQualified();
  } else {
    S.playoffRun = null;
    screenPlayoffsMissed();
  }
}

  const modes = pickPlayoffModes(3);
  S._playoffModeChoices = modes;

function resolvePlayoffRound(modeId){
  const idx = S.playoffRun.round;
  const r = S.ratings, ov = overall(r);
  const opp = S.playoffRun.currentOpp;
  const mode = S._playoffModeChoices.find(m=>m.id===modeId);
  const ownPower = S.teamQuality*0.5 + ov*0.5 + (S.confidence-50)*0.15;
  const diff = ownPower - opp.quality;
  const finalsPenalty = idx === ROUNDS.length-1 ? 0.08 : 0;
  const winChance = clamp(0.46 + diff/165 + r[mode.stat]/750 - finalsPenalty, 0.05, 0.78);
  const injuryRisk = mode.injuryRisk, statMult = mode.statMult, finalsMvpMod = mode.finalsMvpMod;

  const won = Math.random() < winChance;
  const games = rand(4,7);
  const confMult = 0.85 + (S.confidence/100)*0.3;
  // Les stats de playoffs restent ancrées sur ce que le joueur a montré en saison régulière,
  // avec une petite variation selon l'approche choisie — pas de gonflage artificiel.
  const basePts = S._season.points, baseAst = S._season.assists, baseReb = S._season.rebounds;
  const modeBoost = 1.12;
  const pts = clamp(basePts * (mode.stat==='scoring' ? modeBoost*statMult : 0.95) * confMult + rand(-1.5,1.5), Math.max(1, basePts*0.55), basePts*1.35+3);
  const ast = clamp(baseAst * (mode.stat==='playmaking' ? modeBoost : 0.95) * confMult + rand(-1,1)*0.5, Math.max(0.3, baseAst*0.55), baseAst*1.35+2);
  const reb = clamp(baseReb * (mode.stat==='rebounding' ? modeBoost : 0.95) + rand(-1,1)*0.5, Math.max(0.5, baseReb*0.55), baseReb*1.35+2);

  S.playoffRun.stats.games += games;
  S.playoffRun.stats.points += Math.round(pts*games);
  S.playoffRun.stats.rebounds += Math.round(reb*games);
  S.playoffRun.stats.assists += Math.round(ast*games);
  S.playoffRun.rounds.push({round:roundLabel(idx), opponent:opp.name, won, pts, reb, ast, games, mode:mode.title});

  if(Math.random() < injuryRisk * LIFESTYLES[S.lifestyle].injuryMod){
    bumpConfidence(-(rand(2,6)));
  }

  let finalsMvp = false;
  if(won){
    bumpConfidence(rand(6,12));
    if(idx === ROUNDS.length-1){
      S.playoffRun.depth = 4;
      finalsMvp = Math.random() < clamp((ov/160)*finalsMvpMod, 0.05, 0.6);
      S.playoffRun.finalsMvp = finalsMvp;
      S.legacy += finalsMvp ? 12 : 6;
    } else {
      S.playoffRun.depth = idx+1;
    }
  } else {
    bumpConfidence(-(rand(4,10)));
    S.playoffRun.depth = idx;
  }

  screenRoundResult(idx, opp, won, {pts, reb, ast, games}, finalsMvp);
}

function screenRoundResult(idx, opp, won, box, finalsMvp){
  const isChampion = won && idx === ROUNDS.length-1;
  const copy = LANG==='en' ? {
    seriesWon:'Series Won', seriesLost:'Series Lost', against:'against the',
    matches:'Games', champion:'NBA Champion', finalsMvp:'Finals MVP',
    nextRound:'Next Round', continue:'Continue'
  } : {
    seriesWon:'Série remportée', seriesLost:'Série perdue', against:'face aux',
    matches:'Matchs', champion:'Champion NBA', finalsMvp:'Finals MVP',
    nextRound:'Round suivant', continue:'Continuer'
  };
  app.innerHTML = `
  ${renderIdCard(`${S.team} · ${S.age} · ${t('season')} ${S.season}`)}
  <div class="card">
    <p class="eyebrow">${roundLabel(idx)}</p>
    <h2>${won ? copy.seriesWon : copy.seriesLost} ${copy.against} ${opp.name}</h2>
    <table class="boxscore">
      <tr><th>PTS/g</th><th>REB/g</th><th>AST/g</th><th>${copy.matches}</th></tr>
      <tr><td>${box.pts.toFixed(1)}</td><td>${box.reb.toFixed(1)}</td><td>${box.ast.toFixed(1)}</td><td>${box.games}</td></tr>
    </table>
    <div>
      ${isChampion ? `<span class="badge badge-gold">${copy.champion}</span>` : ''}
      ${finalsMvp ? `<span class="badge badge-red">${copy.finalsMvp}</span>` : ''}
      ${!won ? `<span class="badge badge-navy">${playoffResultLabel(S.playoffRun.depth)}</span>` : ''}
    </div>
    ${renderConfidenceBar()}
    <button class="btn-primary" id="roundContinueBtn" style="margin-top:10px;">${won && idx<ROUNDS.length-1 ? copy.nextRound : copy.continue}</button>
  </div>`;
  document.getElementById('roundContinueBtn').addEventListener('click', ()=>{
    if(won && idx < ROUNDS.length-1){
      S.playoffRun.round += 1;
      screenPlayoffRound();
    } else {
      finalizeSeason();
    }
  });
}

// ---------- FINALIZE SEASON (awards, finances, log) ----------
function finalizeSeason(){
  const sd = S._season;
  const ov = sd.ov;
  const beforeCareerPoints = S.career.points;
  const beforeCareerGames = S.career.games;
  const beforeCareerRebounds = S.career.rebounds;
  const beforeCareerAssists = S.career.assists;
  const beforeCareerBlocks = S.career.blocks;

  S.career.games += sd.games;
  S.career.points += Math.round(sd.points*sd.games);
  S.career.assists += Math.round(sd.assists*sd.games);
  S.career.rebounds += Math.round(sd.rebounds*sd.games);
  S.career.steals += Math.round(sd.steals*sd.games);
  S.career.blocks += Math.round(sd.blocks*sd.games);
  S.career.seasons += 1;

  const madePlayoffsRun = !!S.playoffRun;
  const champResult = madePlayoffsRun ? {won: S.playoffRun.depth===4, finalsMvp: !!S.playoffRun.finalsMvp} : {won:false, finalsMvp:false};

  if(madePlayoffsRun){
    S.playoffCareer.appearances += 1;
    S.playoffCareer.games += S.playoffRun.stats.games;
    S.playoffCareer.points += S.playoffRun.stats.points;
    S.playoffCareer.rebounds += S.playoffRun.stats.rebounds;
    S.playoffCareer.assists += S.playoffRun.stats.assists;
    S.playoffCareer.bestDepth = Math.max(S.playoffCareer.bestDepth, S.playoffRun.depth);
  }

  if(champResult.won){
    S.awards.champ += 1;
    if(champResult.finalsMvp) S.awards.finalsMvp += 1;
  }

  const isAllStar = ov >= 64 && sd.points >= 19 && Math.random() < clamp(((ov-61)/50 + (S.confidence-50)/550)*0.85, 0.06, 0.85);
  if(isAllStar){ S.awards.allStar += 1; bumpConfidence(rand(2,5)); }

  // Un MVP ne se gagne jamais dans une équipe qui perd — il faut au moins une saison globalement gagnante.
  const isMVPCandidate = ov >= 63 && sd.points >= 24 && sd.wins >= 39;
  const wonMVP = isMVPCandidate && Math.random() < 0.42;
  if(wonMVP){ S.awards.mvp += 1; bumpConfidence(rand(5,10)); }

  const isDPOYCandidate = S.ratings.defense >= 83;
  const wonDPOY = isDPOYCandidate && Math.random() < 0.12;
  if(wonDPOY) S.awards.dpoy += 1;

  if(S.season === 1 && ov >= 65 && Math.random() < 0.3) S.awards.roty = true;

  const salary = S.finance.salary;
  const investIncome = S.finance.investmentIncome;
  const circle = CIRCLES[S.circle];
  const lifestyle = LIFESTYLES[S.lifestyle];

  let endorsement = Math.round((S.legacy*0.15 + Math.pow(Math.max(0,S.legacy)/100,1.6)*3 + S.awards.allStar*0.3 + S.awards.mvp*1.5 + sd.points*0.05 + ((S.reputation||55)-55)*0.04) * 10)/10;
  if(isAllStar) endorsement += rand(1,4)/10*3;
  if(wonMVP) endorsement += rand(12,28)/10;
  if(champResult.won) endorsement += rand(3,10)/10;
  if(circle.endorsementBoost) endorsement *= (1+circle.endorsementBoost);
  endorsement = Math.max(0, Math.round(endorsement*10)/10);

  if(circle.legacyBoost) S.legacy += circle.legacyBoost;
  if(lifestyle.legacyBonus) S.legacy += lifestyle.legacyBonus*0.3;
  if(circle.prideBoost && (wonMVP || isAllStar)) bumpConfidence(rand(2,4));

  // Objectif fixé par le club en fonction de son standing, avec prime à la clé si rempli.
  const objective = clubObjective(S.teamQuality);
  const objectiveMet = objective.check(champResult.won, madePlayoffsRun);
  const objectiveBonus = objectiveMet ? Math.round(salary * objective.bonusPct * 10)/10 : 0;

  const grossIncome = Math.round((salary + endorsement + investIncome + objectiveBonus)*10)/10;
  const agentFee = Math.round(grossIncome * circle.fee * 10)/10;
  const baseLivingPct = S.lifestyle==='party' ? 0.17 : S.lifestyle==='strict' ? 0.07 : 0.11;
  // Plus la fortune déjà cumulée est grosse, plus le train de vie et la pression fiscale grignotent une part importante des revenus.
  const wealthTaxPct = clamp(S.finance.careerEarnings / 400, 0, 0.22);
  const livingCostPct = clamp(baseLivingPct + wealthTaxPct, 0.05, 0.4);
  const livingCost = Math.round(grossIncome * livingCostPct * 10)/10;

  S.finance.careerEarnings = Math.round((S.finance.careerEarnings + grossIncome - agentFee - livingCost)*10)/10;
  S.finance.careerEndorsements = Math.round((S.finance.careerEndorsements + endorsement)*10)/10;
  S.finance.agentFees = Math.round(((S.finance.agentFees||0) + agentFee)*10)/10;
  S.finance.livingCosts = Math.round(((S.finance.livingCosts||0) + livingCost)*10)/10;
  S.finance.contractYears -= 1;

  // Le moral réagit aussi à ce qui s'est vraiment passé sur le terrain, pas seulement aux choix.
  let perfDrift = 0;
  if(champResult.won) perfDrift += 6;
  else if(madePlayoffsRun && S.playoffRun.depth >= 2) perfDrift += 3;
  else if(!madePlayoffsRun) perfDrift -= 3;
  if(wonMVP) perfDrift += 8;
  if(isAllStar) perfDrift += 3;
  if(ov < 45) perfDrift -= 4;
  const drift = (rand(-4,4) + perfDrift) * (circle.stability ? 0.5 : 1);
  bumpConfidence(drift);

  const rating = seasonRating(sd.points, ov, champResult.won, isAllStar, madePlayoffsRun);
  const tier = seasonTier(S.teamQuality);
  const headlinePool = (arr) => arr[rand(0,arr.length-1)];
  let headline;
  if(LANG==='en'){
    if(champResult.won) headline = headlinePool([
      `"${S.team} on top of the world, ${S.name} at the summit"`,
      `"Historic title for ${S.team}"`,
      `"${S.name} finally lifts the trophy"`,
      `"${S.team} conquers the league"`
    ]);
    else if(wonMVP) headline = headlinePool([
      `"${S.name} named MVP, a dream season"`,
      `"An exceptional individual season for ${S.name}"`,
      `"${S.name} dominates the league this year"`
    ]);
    else if(!madePlayoffsRun) headline = headlinePool([
      `"${S.team} misses the playoffs, a season to forget"`,
      `"Disappointment in ${S.team}, a busy offseason looms"`,
      `"${S.team} finishes well off the pace"`,
      `"A frustrating season for ${S.team}"`
    ]);
    else if(isAllStar) headline = headlinePool([
      `"${S.name} confirms his place among the league's elite"`,
      `"Another fine season for ${S.name}"`,
      `"${S.name}, a sure bet for ${S.team}"`
    ]);
    else headline = headlinePool([
      `"${S.team} has an uneventful season"`,
      `"A decent season, nothing more, for ${S.team}"`,
      `"${S.name} and ${S.team} are middle-of-the-pack this year"`,
      `"Nothing notable out of ${S.team}"`
    ]);
  } else {
    if(champResult.won) headline = headlinePool([
      `« ${S.team} sur le toit, ${S.name} au sommet »`,
      `« Sacre historique pour ${S.team} »`,
      `« ${S.name} soulève enfin le trophée »`,
      `« ${S.team} conquiert la ligue »`
    ]);
    else if(wonMVP) headline = headlinePool([
      `« ${S.name} élu MVP, saison de rêve »`,
      `« Saison individuelle exceptionnelle pour ${S.name} »`,
      `« ${S.name} domine la ligue cette année »`
    ]);
    else if(!madePlayoffsRun) headline = headlinePool([
      `« ${S.team} manque les playoffs, saison à oublier »`,
      `« Désillusion à ${S.team}, l'intersaison s'annonce agitée »`,
      `« ${S.team} termine loin du compte »`,
      `« Une saison frustrante pour ${S.team} »`
    ]);
    else if(isAllStar) headline = headlinePool([
      `« ${S.name} confirme parmi l'élite de la ligue »`,
      `« Encore une belle saison pour ${S.name} »`,
      `« ${S.name}, valeur sûre de ${S.team} »`
    ]);
    else headline = headlinePool([
      `« ${S.team} traverse une saison sans relief »`,
      `« Une saison correcte, sans plus, pour ${S.team} »`,
      `« ${S.name} et ${S.team} dans la moyenne cette année »`,
      `« Rien de marquant du côté de ${S.team} »`
    ]);
  }

  // Toute la classe de draft évolue chaque saison, avec ses propres hauts et bas.
  if(S.draftClass){
    S.draftClass.forEach(peer=>{
      peer.ov = clamp(peer.ov + rand(-3,4), 35, 99);
      peer.ppg = clamp(Math.round((peer.ppg + rand(-2,3))*10)/10, 4, 34);
      if(peer.ov >= 88 && Math.random() < 0.1) peer.mvps += 1;
      if(peer.ov >= 82 && Math.random() < 0.35) peer.allStars += 1;
      if(Math.random() < 0.1) peer.champs += 1;
    });
  }

  // Confiance du coach et du front office : influencée par les résultats de l'équipe.
  if(S.coach){
    if(champResult.won) S.coach.trust = clamp(S.coach.trust + 20, 0, 100);
    else if(madePlayoffsRun) S.coach.trust = clamp(S.coach.trust + 6, 0, 100);
    else S.coach.trust = clamp(S.coach.trust - 12, 0, 100);
    S.coach.trust = clamp(S.coach.trust + rand(-4,4), 0, 100);
  }
  if(champResult.won) S.gmTrust = clamp(S.gmTrust + 15, 0, 100);
  else if(!madePlayoffsRun) S.gmTrust = clamp(S.gmTrust - 8, 0, 100);
  S.gmTrust = clamp(S.gmTrust + rand(-3,3), 0, 100);

  if(!S.teamStats[S.team]) S.teamStats[S.team] = {seasons:0, games:0, points:0, rebounds:0, assists:0, champs:0, allStars:0, mvps:0, franchiseRecord: rand(15000,28000)};
  const ts = S.teamStats[S.team];
  const beforeTsPoints = ts.points;
  ts.seasons += 1;
  ts.games += sd.games;
  ts.points += Math.round(sd.points*sd.games);
  ts.rebounds += Math.round(sd.rebounds*sd.games);
  ts.assists += Math.round(sd.assists*sd.games);
  if(champResult.won) ts.champs += 1;
  if(isAllStar) ts.allStars += 1;
  if(wonMVP) ts.mvps += 1;

  const milestones = [];
  if(beforeTsPoints < ts.franchiseRecord && ts.points >= ts.franchiseRecord){
    milestones.push(LANG==='en' ? `🏀 You become the all-time leading scorer in ${S.team} history!` : `🏀 Tu deviens le meilleur marqueur de l'histoire de ${S.team} !`);
  }
  [500,1000,1500].forEach(m=>{
    if(beforeCareerGames < m && S.career.games >= m) milestones.push(LANG==='en' ? `🎽 You reach ${m} career games played!` : `🎽 Tu atteins les ${m} matchs joués en carrière !`);
  });
  [5000,10000,15000,20000,25000].forEach(m=>{
    if(beforeCareerPoints < m && S.career.points >= m) milestones.push(LANG==='en' ? `🔢 You cross the ${m.toLocaleString('en-US')} career points mark!` : `🔢 Tu passes la barre des ${m.toLocaleString('fr-FR')} points en carrière !`);
  });
  [2000,4000,6000,8000,10000].forEach(m=>{
    if(beforeCareerRebounds < m && S.career.rebounds >= m) milestones.push(LANG==='en' ? `🧱 You cross the ${m.toLocaleString('en-US')} career rebounds mark!` : `🧱 Tu passes la barre des ${m.toLocaleString('fr-FR')} rebonds en carrière !`);
  });
  [2000,4000,6000,8000,10000].forEach(m=>{
    if(beforeCareerAssists < m && S.career.assists >= m) milestones.push(LANG==='en' ? `🎯 You cross the ${m.toLocaleString('en-US')} career assists mark!` : `🎯 Tu passes la barre des ${m.toLocaleString('fr-FR')} passes décisives en carrière !`);
  });
  [300,600,900,1200,1500].forEach(m=>{
    if(beforeCareerBlocks < m && S.career.blocks >= m) milestones.push(LANG==='en' ? `🛡️ You cross the ${m.toLocaleString('en-US')} career blocks mark!` : `🛡️ Tu passes la barre des ${m.toLocaleString('fr-FR')} contres en carrière !`);
  });
  if(sd.points >= (S._bestSeasonPtsEver||0) + 0.5 && S.career.seasons >= 2){
    milestones.push(LANG==='en' ? `📈 Your best career scoring average: ${sd.points.toFixed(1)} PTS/g!` : `📈 Meilleure moyenne de points de ta carrière : ${sd.points.toFixed(1)} PTS/m !`);
  }
  if(sd.rebounds >= (S._bestSeasonRebEver||0) + 0.3 && S.career.seasons >= 2){
    milestones.push(LANG==='en' ? `📈 Your best career rebounding average: ${sd.rebounds.toFixed(1)} REB/g!` : `📈 Meilleure moyenne de rebonds de ta carrière : ${sd.rebounds.toFixed(1)} REB/m !`);
  }
  if(sd.assists >= (S._bestSeasonAstEver||0) + 0.3 && S.career.seasons >= 2){
    milestones.push(LANG==='en' ? `📈 Your best career assists average: ${sd.assists.toFixed(1)} AST/g!` : `📈 Meilleure moyenne de passes de ta carrière : ${sd.assists.toFixed(1)} PAS/m !`);
  }
  S._bestSeasonPtsEver = Math.max(S._bestSeasonPtsEver||0, sd.points);
  S._bestSeasonRebEver = Math.max(S._bestSeasonRebEver||0, sd.rebounds);
  S._bestSeasonAstEver = Math.max(S._bestSeasonAstEver||0, sd.assists);

  // Triple-doubles estimés sur la saison, et pics de performance dans un match précis.
  const tdCloseness = clamp((sd.assists-5)/8,0,1) * clamp((sd.rebounds-5)/8,0,1);
  const tdChancePerGame = sd.points>=10 ? tdCloseness*0.35 : 0;
  let tripleDoubles = 0;
  for(let g=0; g<Math.round(sd.games); g++){ if(Math.random() < tdChancePerGame) tripleDoubles++; }
  if(tripleDoubles >= 1){
    milestones.push(LANG==='en' ? `🔺 ${tripleDoubles} triple-double${tripleDoubles>1?'s':''} this season!` : `🔺 ${tripleDoubles} triple-double${tripleDoubles>1?'s':''} cette saison !`);
  }

  const bestGamePoints = Math.round(sd.points * (1.3+Math.random()*0.6) + rand(0,6));
  const bestGameAssists = Math.round(sd.assists * (1.5+Math.random()*0.7) + rand(0,3));
  const bestGameRebounds = Math.round(sd.rebounds * (1.4+Math.random()*0.6) + rand(0,3));
  const bestGameBlocks = Math.round(sd.blocks * (1.6+Math.random()*0.8) + rand(0,2));

  if(bestGamePoints > (S._careerBestGamePoints||0)){
    S._careerBestGamePoints = bestGamePoints;
    milestones.push(LANG==='en' ? `🌟 New personal record: ${bestGamePoints} points in a game!` : `🌟 Nouveau record personnel : ${bestGamePoints} points dans un match !`);
  }
  if(bestGameRebounds > (S._careerBestGameRebounds||0)){
    S._careerBestGameRebounds = bestGameRebounds;
    milestones.push(LANG==='en' ? `🌟 New personal record: ${bestGameRebounds} rebounds in a game!` : `🌟 Nouveau record personnel : ${bestGameRebounds} rebonds dans un match !`);
  }
  if(bestGameBlocks > (S._careerBestGameBlocks||0)){
    S._careerBestGameBlocks = bestGameBlocks;
    milestones.push(LANG==='en' ? `🌟 New personal record: ${bestGameBlocks} blocks in a game!` : `🌟 Nouveau record personnel : ${bestGameBlocks} contres dans un match !`);
  }
  if(bestGameBlocks >= 17){
    milestones.push(LANG==='en' ? `🛡️ ${bestGameBlocks} blocks in a game — you match the NBA record held by Elmore Smith (17, 1973)!` : `🛡️ ${bestGameBlocks} contres dans un match — tu égales le record NBA d'Elmore Smith (17, 1973) !`);
  } else if(bestGameBlocks >= 10){
    milestones.push(LANG==='en' ? `🛡️ ${bestGameBlocks} blocks in a game — a monumental defensive performance!` : `🛡️ ${bestGameBlocks} contres dans un match — une performance défensive monumentale !`);
  }
  if(bestGameAssists > (S._careerBestGameAssists||0)){
    S._careerBestGameAssists = bestGameAssists;
    milestones.push(LANG==='en' ? `🌟 New personal record: ${bestGameAssists} assists in a game!` : `🌟 Nouveau record personnel : ${bestGameAssists} passes décisives dans un match !`);
  }
  if(bestGamePoints >= 100){
    milestones.push(LANG==='en' ? `🐐 100 POINTS IN A GAME! You match Wilt Chamberlain's all-time record (100 pts, 1962)!` : `🐐 100 POINTS DANS UN MATCH ! Tu égales le record all-time de Wilt Chamberlain (100 pts, 1962) !`);
  } else if(bestGamePoints >= 70){
    milestones.push(LANG==='en' ? `🔥 ${bestGamePoints} points in a game — you're closing in on Wilt Chamberlain's historic record (100 pts, 1962)!` : `🔥 ${bestGamePoints} points dans un match — tu t'approches du record historique de Wilt Chamberlain (100 pts, 1962) !`);
  } else if(bestGamePoints >= 50){
    milestones.push(LANG==='en' ? `💥 You join the exclusive club of players to score 50+ points in an NBA game (${bestGamePoints} pts)!` : `💥 Tu rejoins le club très fermé des joueurs à avoir marqué 50+ points dans un match NBA (${bestGamePoints} pts) !`);
  }
  if(bestGameAssists >= 30){
    milestones.push(LANG==='en' ? `🎯 ${bestGameAssists} assists in a game — you match Scott Skiles' NBA record (30, 1990)!` : `🎯 ${bestGameAssists} passes décisives dans un match — tu égales le record NBA de Scott Skiles (30, 1990) !`);
  } else if(bestGameAssists >= 20){
    milestones.push(LANG==='en' ? `🎯 ${bestGameAssists} assists in a game — an exceptional playmaking performance!` : `🎯 ${bestGameAssists} passes décisives dans un match — une performance de passeur exceptionnelle !`);
  }
  if(bestGameRebounds >= 55){
    milestones.push(LANG==='en' ? `🧱 ${bestGameRebounds} rebounds in a game — you match Wilt Chamberlain's historic record (55, 1960)!` : `🧱 ${bestGameRebounds} rebonds dans un match — tu égales le record historique de Wilt Chamberlain (55, 1960) !`);
  } else if(bestGameRebounds >= 30){
    milestones.push(LANG==='en' ? `🧱 ${bestGameRebounds} rebounds in a game — a monster rebounding performance!` : `🧱 ${bestGameRebounds} rebonds dans un match — une performance monstrueuse au rebond !`);
  }

  S._pendingMilestones = milestones;

  S.log.push({season:S.season, age:S.age, team:S.team, games:sd.games, points:sd.points, assists:sd.assists,
    rebounds:sd.rebounds, steals:sd.steals, blocks:sd.blocks, ov, allStar:isAllStar, mvp:wonMVP, dpoy:wonDPOY,
    champ:champResult.won, finalsMvp:champResult.finalsMvp, rating, tier, wins:sd.wins, losses:sd.losses,
    playoffDepth: madePlayoffsRun ? S.playoffRun.depth : -1});

  S._seasonBonus = 0;
  const playoffSnapshot = madePlayoffsRun ? {
    depth: S.playoffRun.depth,
    label: playoffResultLabel(S.playoffRun.depth),
    stats: S.playoffRun.stats
  } : null;

  const seasonRes = {
    games:sd.games, points:sd.points, assists:sd.assists, rebounds:sd.rebounds, steals:sd.steals, blocks:sd.blocks,
    ov, isAllStar, wonMVP, wonDPOY, wonChampionship:champResult.won, finalsMvp:champResult.finalsMvp,
    salary, endorsement, investIncome, agentFee, livingCost, madePlayoffs:madePlayoffsRun, playoff:playoffSnapshot,
    rating, tier, headline, objective, objectiveMet, objectiveBonus, chemistryBlurb:teamChemistryBlurb(drift),
    leagueNews: leagueNewsPick(), wins:sd.wins, losses:sd.losses
  };
  if(S._pendingMilestones && S._pendingMilestones.length){
    screenMilestones(S._pendingMilestones, seasonRes);
  } else {
    screenSeasonResult(seasonRes);
  }
}

  app.innerHTML = `
  <div class="final-hero">
    <div class="hof">🎉 ${LANG==='en'?'MILESTONE REACHED!':'JALON FRANCHI !'}</div>
    <div class="sub">${S.name} ${LANG==='en'?'makes history':"marque l'histoire"}</div>

    <button class="btn-primary" id="milestoneContinueBtn" style="margin-top:10px;">${t('continue')}</button>
  </div>`;
  document.getElementById('milestoneContinueBtn').addEventListener('click', ()=>{ screenSeasonResult(seasonRes); });
}

function seasonTier(teamQuality){
  if(LANG==='en'){
    if(teamQuality>=70) return 'ELITE';
    if(teamQuality>=45) return 'SOLID';
    return 'REBUILDING';
  }
  if(teamQuality>=70) return 'ÉLITE';
  if(teamQuality>=45) return 'SOLIDE';
  return 'RECONSTRUCTION';
}

function seasonRating(points, ov, champWon, isAllStar, madePlayoffs){
  let r = 5.3 + (points-12)/9 + (ov-55)/22;
  if(champWon) r += 0.7;
  if(isAllStar) r += 0.3;
  if(madePlayoffs) r += 0.2;
  r += rand(-4,4)/10;
  return clamp(Math.round(r*10)/10, 1, 10);
}

function clubObjective(teamQuality){
  if(LANG==='en'){
    if(teamQuality>=70) return {text:'Win a major trophy', bonusPct:0.16, check:(champWon)=>champWon};
    if(teamQuality>=45) return {text:'Reach the playoffs', bonusPct:0.09, check:(champWon,madePlayoffs)=>madePlayoffs};
    return {text:'Develop young talent and stay competitive', bonusPct:0.04, check:()=>true};
  }
  if(teamQuality>=70) return {text:'Remporter un trophée majeur', bonusPct:0.16, check:(champWon)=>champWon};
  if(teamQuality>=45) return {text:'Atteindre les playoffs', bonusPct:0.09, check:(champWon,madePlayoffs)=>madePlayoffs};
  return {text:'Développer les jeunes talents et rester compétitif', bonusPct:0.04, check:()=>true};
}

function renderSeasonLog(log){
  log = log || S.log;
  if(!log.length) return `<p class="muted">${LANG==='en'?'No seasons played.':'Aucune saison jouée.'}</p>`;
  const rows = log.map(l=>{
    const icons = [];
    if(l.champ) icons.push('🏆');
    if(l.finalsMvp) icons.push('🎖️');
    if(l.mvp) icons.push('👑');
    if(l.allStar) icons.push('⭐');
    if(l.dpoy) icons.push('🛡️');
    if(!l.champ && l.playoffDepth>=0 && l.playoffDepth<4) icons.push('🏅');
    if(l.playoffDepth===-1) icons.push('❌');
    const tier = l.tier || '—';
    const rating = l.rating!==undefined ? l.rating.toFixed(1) : '—';
    const record = (l.wins!==undefined) ? ` (${l.wins}-${l.losses})` : '';
    return `<tr>
      <td style="font-family:'Anton',sans-serif;font-size:16px;color:var(--navy);">${l.age}</td>
      <td><span class="badge badge-gold" style="margin:0;">${tier}</span> ${l.team}${record}</td>
      <td style="white-space:nowrap;">${Math.round(l.games||0)}${LANG==='en'?'g':'m'} · ${l.points.toFixed(0)}pts · ${rating}</td>
      <td style="font-size:15px;">${icons.join(' ')||''}</td>
    </tr>`;
  }).join('');
  const headers = LANG==='en' ? {age:'Age', team:'Team', season:'Season'} : {age:'Âge', team:'Équipe', season:'Saison'};
  const legend = LANG==='en'
    ? "🏆 NBA Title · 🎖️ Finals MVP · 👑 MVP · ⭐ All-Star · 🛡️ DPOY · 🏅 Eliminated in playoffs · ❌ Missed playoffs"
    : "🏆 Titre NBA · 🎖️ Finals MVP · 👑 MVP · ⭐ All-Star · 🛡️ DPOY · 🏅 Éliminé en playoffs · ❌ Playoffs manqués";
  return `<div style="overflow-x:auto;"><table class="boxscore">
    <tr><th>${headers.age}</th><th>${headers.team}</th><th>${headers.season}</th><th></th></tr>
    ${rows}
  </table></div>
  <p class="muted" style="font-size:11px;margin-top:6px;">${legend}</p>`;
}

function renderCareerMini(){
  const c = S.career;
  const ppg = c.games? (c.points/c.games).toFixed(1):'0.0';
  const rpg = c.games? (c.rebounds/c.games).toFixed(1):'0.0';
  const apg = c.games? (c.assists/c.games).toFixed(1):'0.0';
  const labels = LANG==='en'
    ? {seasons:'Seasons', ppg:'Pts/g', rpg:'Reb/g', apg:'Ast/g', titles:'Titles'}
    : {seasons:'Saisons', ppg:'Pts/m', rpg:'Reb/m', apg:'Pas/m', titles:'Titres'};
  return `<div class="stat-grid">
    <div class="stat-box"><div class="v">${c.seasons}</div><div class="l">${labels.seasons}</div></div>
    <div class="stat-box"><div class="v">${ppg}</div><div class="l">${labels.ppg}</div></div>
    <div class="stat-box"><div class="v">${rpg}</div><div class="l">${labels.rpg}</div></div>
    <div class="stat-box"><div class="v">${apg}</div><div class="l">${labels.apg}</div></div>
    <div class="stat-box"><div class="v">${S.awards.champ}</div><div class="l">${labels.titles}</div></div>
  </div>`;
}

function nextStepButtons(){
  const canRetire = S.age >= 30;
  let html = `<button class="btn-primary" id="nextSeasonBtn">${t('nextSeason')}</button>`;
  if(canRetire) html += `<button class="btn-ghost" id="retireBtn">${t('retire')}</button>`;
  return html;
}

function attachNextStepHandlers(){
  const nb = document.getElementById('nextSeasonBtn');
  if(nb) nb.addEventListener('click', ()=>{
    S.age += 1; S.season += 1;
    const ov = overall(S.ratings);
    const gmProtection = (S.gmTrust||55)/100;
    const waiveChance = clamp(((48-ov)/45) * (1.4 - gmProtection) * 1.1, 0, 0.5);
    if(ov <= 37 || S.age >= 42){
      retireOrFarewell();
    } else if(S.finance.contractYears <= 0){
      screenContractNegotiation();
    } else if(S.finance.contractYears > 0 && ov < 48 && Math.random() < waiveChance){
      screenWaived();
    } else if(S.coach && S.coach.trust <= 15 && Math.random() < 0.6){
      screenCoachFired();
    } else {
      offseasonChoice();
    }
  });
  const rb = document.getElementById('retireBtn');
  if(rb) rb.addEventListener('click', retireOrFarewell);
}

function retireOrFarewell(){
  S.retired = true;
  if(computeLegacy() >= 190){
    screenFarewellTour();
  } else {
    screenFinal();
  }
}

  const otherTeams = TEAMS.filter(t=>t!==S.team);

function screenContractNegotiation(){
  const ov = overall(S.ratings);
  const marketSalary = Math.max(0.9, Math.round((ov-38)*0.55*10)/10);

  if(ov < 42){
    screenNoOffers();
    return;
  }

  const overseasEligible = ov < 60 || S.age >= 33;
  const copy = LANG==='en' ? {
    extendT:(team)=>`Sign a Max Contract With ${team}`, extendS:(s)=>`${s}/year over 5 years — you stay loyal to the franchise`,
    marketT:'Test the Free Agency Market', marketS:'Compare several concrete offers from different teams',
    contenderT:'Accept a Reduced Deal With a Contender', contenderS:(s)=>`${s}/year, but a strong team around you`,
    overseasT:'Go Play Overseas for the Money', overseasS:'EuroLeague, China... a big check to close out your NBA career',
    eyebrow:'Offseason — Free Agency', title:'Contract Negotiation',
    desc:(ov,m,c)=>`Current overall: <strong>${ov}</strong>. Estimated market value: <strong>${m}/year</strong>. Career earnings so far: <strong>${c}</strong>.`,
    endOfContract:'End of contract'
  } : {
    extendT:(team)=>`Signer un maxi contrat avec ${team}`, extendS:(s)=>`${s}/an sur 5 ans — tu restes fidèle à la franchise`,
    marketT:'Tester le marché de la free agency', marketS:"Compare plusieurs offres concrètes d'équipes différentes",
    contenderT:'Accepter un contrat réduit chez un contender', contenderS:(s)=>`${s}/an, mais forte équipe autour de toi`,
    overseasT:"Partir jouer à l'étranger pour l'argent", overseasS:"EuroLeague, Chine... un gros chèque pour clore ta carrière NBA",
    eyebrow:'Intersaison — Free Agency', title:'Négociation de contrat',
    desc:(ov,m,c)=>`Overall actuel : <strong>${ov}</strong>. Valeur marché estimée : <strong>${m}/an</strong>. Cumul carrière jusqu'ici : <strong>${c}</strong>.`,
    endOfContract:'Fin de contrat'
  };
  const options = [
    {mode:'extend', title:copy.extendT(S.team), sub:copy.extendS(fmtMoney(Math.round(marketSalary*1.1*10)/10))},
    {mode:'market', title:copy.marketT, sub:copy.marketS},
    {mode:'contender', title:copy.contenderT, sub:copy.contenderS(fmtMoney(Math.round(marketSalary*0.55*10)/10))}
  ];
  if(overseasEligible){
    options.push({mode:'overseas', title:copy.overseasT, sub:copy.overseasS});
  }

  app.innerHTML = `
  ${renderIdCard(`${S.team} · ${S.age} · ${copy.endOfContract}`)}
  <div class="card">
    <p class="eyebrow">${copy.eyebrow}</p>
    <h2>${copy.title}</h2>
    <p class="muted">${copy.desc(ov, fmtMoney(marketSalary), fmtMoney(S.finance.careerEarnings))}</p>
    <div class="choice-row single" id="contractRow">
      ${options.map(o=>`
        <button class="choice-btn" data-mode="${o.mode}">
          <span class="opt-title">${o.title}</span>
          <span class="opt-sub">${o.sub}</span>
        </button>`).join('')}
    </div>
  </div>`;
  const row = document.getElementById('contractRow');
  row.querySelectorAll('.choice-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const mode = b.dataset.mode;
      if(mode==='market'){
        selectAndProceed(row, b, ()=> screenMarketOffers());
      } else if(mode==='overseas'){
        selectAndProceed(row, b, screenOverseasChoice);
      } else {
        selectAndProceed(row, b, ()=> applyContract(mode, marketSalary));
      }
    });
  });
}

// Les saisons à l'étranger font aussi progresser (ou décliner) le joueur, comme en NBA —
// sans quoi un joueur parti à l'étranger ne s'améliore jamais avant de revenir.
function applyOverseasGrowth(){
  const age = S.age;
  const curve = POSITION_AGING_CURVE[S.position] || POSITION_AGING_CURVE.SF;
  let growthPhase;
  if(age <= 23) growthPhase = Math.random() < 0.15 ? rand(-2,1) : rand(4,7);
  else if(age <= curve.peakEnd) growthPhase = Math.random() < 0.12 ? rand(-2,1) : rand(2,4);
  else if(age <= curve.declineStart) growthPhase = rand(-1,2);
  else growthPhase = (-rand(3,7) - Math.round(Math.max(0, age-curve.declineStart)*1.3)) * curve.declineMult;
  growthPhase -= LIFESTYLES[S.lifestyle].agingMod;

  const keys = Object.keys(S.ratings).filter(k=>S.ratings[k]<96);
  const focus = keys.length ? keys.reduce((best,k)=> S.ratings[k]>S.ratings[best]?k:best, keys[0]) : Object.keys(S.ratings)[rand(0,4)];
  Object.keys(S.ratings).forEach(k=>{
    let delta = Math.round(growthPhase * (k===focus ? 1.6 : 0.5));
    delta += rand(-1,1);
    S.ratings[k] = clamp(S.ratings[k] + delta, 20, 99);
  });
}

function applyContract(mode, marketSalary){
  if(mode==='extend'){

    S.legacy += 5;
    bumpConfidence(rand(2,5));
  } else if(mode==='contender'){
    S.finance.salary = Math.round(marketSalary*0.55*10)/10;
    S.finance.contractYears = rand(2,3);
    S.team = TEAMS[rand(0,TEAMS.length-1)];
    S.teamsPlayedFor += 1;
    S.teamQuality = clamp(S.teamQuality + rand(15,28), 20, 95);
    bumpConfidence(rand(3,6));
    screenChangeNumber(offseasonChoice);
    return;
  }
  offseasonChoice();
}

// ---------- FINAL / HALL OF FAME ----------
function computeLegacy(){
  const c = S.career;
  const ppg = c.games? c.points/c.games : 0;
  let score = 0;
  score += c.seasons * 2.2;
  score += ppg * 4;
  score += S.awards.allStar * 10;
  score += S.awards.mvp * 60;
  score += S.awards.dpoy * 25;
  score += S.awards.champ * 35;
  score += S.awards.finalsMvp * 30;
  score += S.awards.roty ? 15 : 0;
  score += S.legacy * 1.5;
  score -= S.majorInjuries * 20;
  score -= (S.timesWaived||0) * 20;
  return Math.round(score);
}

function careerNarrative(legacy){
  if(LANG==='en'){
    if(legacy>=350) return "A legendary career, worthy of the greatest names in league history.";
    if(legacy>=105) return "A very fine career, marked by several All-Star selections and real high points.";
    if(legacy>=56) return "An honest, solid career — that of a respected veteran, useful to his teams.";
    if(legacy>=10) return "An up-and-down career, between good moments and rough patches.";
    return "A difficult career, marked by injuries and missed opportunities.";
  }
  if(legacy>=350) return "Une carrière légendaire, digne des plus grands noms de l'histoire de la ligue.";
  if(legacy>=105) return "Une très belle carrière, marquée par plusieurs sélections All-Star et de vrais sommets.";
  if(legacy>=56) return "Une carrière honnête et solide, celle d'un vétéran respecté et utile à ses équipes.";
  if(legacy>=10) return "Une carrière en dents de scie, entre bons moments et passages à vide.";
  return "Une carrière difficile, semée de blessures et d'occasions manquées.";
}
