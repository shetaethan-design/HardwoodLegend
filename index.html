  const base = archTags[S.archetype] || (LANG==='en' ? 'The Legend' : 'La Légende');
  const place = S.teamStats && Object.keys(S.teamStats).length ? Object.entries(S.teamStats).sort((a,b)=>b[1].seasons-a[1].seasons)[0][0] : S.nationality;
  if(LANG==='en'){
    if(legacy>=165) return `${base} of ${place}`;
    if(legacy>=90) return `The Pro from ${place}`;
    return `The Forgotten One from ${place}`;
  }
  if(legacy>=165) return `${base} de ${place}`;
  if(legacy>=90) return `Le Pro de ${place}`;
  return `L\u2019Oublié de ${place}`;
}

function careerStorySentence(){
  const c = S.career;
  const bestTeamEntry = Object.entries(S.teamStats||{}).sort((a,b)=> b[1].seasons - a[1].seasons)[0];
  const bestTeam = bestTeamEntry ? bestTeamEntry[0] : S.team;
  if(LANG==='en'){
    let s = `${posLabel(S.position) ? (POSITIONS.find(p=>p.id===S.position)||{}).emoji||'' : ''} Spent mostly with ${bestTeam}, ${S.name} finishes with ${c.seasons} season${c.seasons>1?'s':''} under his belt`;
    if(S.awards.champ>0) s += ` and ${S.awards.champ} NBA championship${S.awards.champ>1?'s':''}`;
    else if(S.awards.allStar>0) s += ` and ${S.awards.allStar} All-Star selection${S.awards.allStar>1?'s':''}`;
    else s += `, without ever lifting the Larry O'Brien trophy`;
    s += '.';
    return s;
  }
  let s = `${POSITIONS.find(p=>p.id===S.position).emoji||''} Passé principalement par ${bestTeam}, ${S.name} termine avec ${c.seasons} saison${c.seasons>1?'s':''} au compteur`;
  if(S.awards.champ>0) s += ` et ${S.awards.champ} titre${S.awards.champ>1?'s':''} de champion NBA`;
  else if(S.awards.allStar>0) s += ` et ${S.awards.allStar} sélection${S.awards.allStar>1?'s':''} au All-Star Game`;
  else s += `, sans jamais soulever le trophée Larry O'Brien`;
  s += '.';
  return s;
}

function careerGrade(legacy){
  if(LANG==='en'){
    if(legacy>=350) return {grade:'S', label:'Absolute Legend'};
    if(legacy>=165) return {grade:'A+', label:'Superstar'};
    if(legacy>=105) return {grade:'A', label:'Established All-Star'};
    if(legacy>=85) return {grade:'B+', label:'Very Good Pro'};
    if(legacy>=65) return {grade:'B', label:'Solid Starter'};
    if(legacy>=30) return {grade:'C', label:'Rotation Player'};
    if(legacy>=10) return {grade:'D', label:'Limited Career'};
    return {grade:'E', label:'Anecdotal Career'};
  }
  if(legacy>=350) return {grade:'S', label:'Légende absolue'};
  if(legacy>=165) return {grade:'A+', label:'Superstar'};

}

function computeBadges(){
  const badges = [];
  const c = S.career;
  const ppg = c.games ? c.points/c.games : 0;
  const apg = c.games ? c.assists/c.games : 0;
  const rpg = c.games ? c.rebounds/c.games : 0;
  if(ppg >= 25) badges.push('🎯 Machine à scorer');
  if(apg >= 8) badges.push('🎩 Maestro du jeu');
  if(rpg >= 10) badges.push('🧱 Monstre du rebond');
  if(S.ratings.defense>=90 || S.awards.dpoy>=1) badges.push('🛡️ Verrou défensif');
  if(S.awards.champ >= 3) badges.push('👑 Dynastie');
  if(S.awards.champ === 1) badges.push('🏆 Champion');
  if(S.awards.mvp >= 1) badges.push('⭐ MVP');
  if(S.awards.allStar >= 5) badges.push('🌟 Habitué du All-Star Game');
  if(c.seasons >= 15) badges.push('🕰️ Vétéran');
  if(c.seasons <= 3) badges.push('💨 Carrière éclair');
  if(S.majorInjuries >= 2) badges.push('🩹 Corps fragile');
  if(S.majorInjuries === 0 && c.seasons>=10) badges.push('🦾 Iron Man');
  if(S.teamsPlayedFor >= 4) badges.push('🧳 Nomade');
  if(S.teamsPlayedFor <= 1 && c.seasons>=8) badges.push('❤️ Fidèle à vie');
  if((S.awards.olympicGold||0)+(S.awards.worldCupGold||0) >= 1) badges.push('🌍 Icône internationale');
  if(S.finance.careerEarnings >= 250) badges.push('💎 Fortune colossale');
  if(S.finance.careerEarnings < 15 && c.seasons>=5) badges.push('🪙 Petit portefeuille');
  if(S.jerseyRetired) badges.push('👕 Maillot retiré');
  if(S.wentOverseas) badges.push('✈️ Fin de carrière à l\u2019étranger');
  if(S.overseas && S.overseas.titles >= 1) badges.push('🌏 Champion à l\u2019étranger');
  if(S.overseas && S.overseas.titles >= 3) badges.push('🌏 Dynastie à l\u2019étranger');
  if(S.overseas && S.overseas.seasons >= 5) badges.push('🧳 Globe-trotter du basket');
  if(S.draftPick === 1) badges.push('🥇 1er choix de la draft');
  if(S.draftPick > 40) badges.push('🎲 Non favori de la draft');
  if(S.playoffCareer.appearances === 0 && c.seasons>=6) badges.push('📉 Jamais vu les playoffs');
  if(S.playoffCareer.bestDepth >= 4) badges.push('🏅 Champion en playoffs');
  if(S.playoffCareer.bestDepth === 3) badges.push('🥈 Finaliste malheureux');
  if(S.age >= 40) badges.push('👴 Retraité tardif');
  if(S.finance.investmentIncome >= 5) badges.push('🏦 Investisseur avisé');
  if(((S.awards.olympicGold||0)+(S.awards.worldCupGold||0)) >= 2) badges.push('🧊 Sang-froid international');
  if(S.awards.roty) badges.push('🌱 Rookie sensationnel');
  if(S.background==='quartier' && computeLegacy()>=165) badges.push('🏙️ Success story du quartier');
  if(S.background==='pro_son' && computeLegacy()>=165) badges.push('🌳 Digne héritier');
  if(S.circle==='friends' && c.seasons>=10) badges.push('🤝 Loyal à ses potes');
  if(computeLegacy() >= 350 && (ppg>=14 || S.awards.allStar>=2 || S.awards.champ>=2 || S.awards.mvp>=1 || S.awards.dpoy>=1)) badges.push('🏛️ Hall of Famer');
  if(computeLegacy() >= 600 && (S.awards.mvp >= 1 || ppg >= 24)) badges.push('🐐 GOAT absolu');
  if(S.finance.careerEarnings < 5 && c.seasons>=8) badges.push('💸 Ruiné malgré une longue carrière');
  if(S.majorInjuries >= 3) badges.push('☠️ Carrière brisée par les blessures');
  if((S.timesWaived||0) >= 2) badges.push('🥊 Combattant de survie (plusieurs fois coupé)');
  if(S.ratings.defense>=85 && ppg<10 && c.seasons>=5) badges.push('🛡️ Pur défenseur (jamais scoreur)');
  if(S.teamsPlayedFor<=1 && S.awards.champ>=1) badges.push('🏰 Légende locale (un seul club, champion)');
  if(S.hadOverseasComeback) badges.push('🎢 Retour improbable de l\u2019étranger');
  if(S.draftPick >= 50 && computeLegacy() >= 165) badges.push('💎 Diamant brut trouvé nulle part');
  if(computeLegacy() < 50) badges.push('😶 Carrière discrète');
  if(badges.length===0) badges.push('🧢 Joueur de rotation');
  return badges;
}

async function awardCareerPoints(legacy){
  try{
    const pts = Math.max(1, Math.round(legacy/25));
    let current = 0;
    try{ const r = await window.storage.get('careerPoints', false); current = r ? Number(r.value)||0 : 0; }catch(e){}
    await window.storage.set('careerPoints', String(current+pts), false);
    return pts;
  }catch(e){ return 0; }
}

async function getCareerPoints(){
  try{ const r = await window.storage.get('careerPoints', false); return r ? Number(r.value)||0 : 0; }catch(e){ return 0; }
}

async function spendCareerPoints(amount){
  const current = await getCareerPoints();
  if(amount > current) return false;
  try{ await window.storage.set('careerPoints', String(current-amount), false); return true; }catch(e){ return false; }
}

async function getPendingBoosts(){
  try{ const r = await window.storage.get('pendingBoosts', false); return r ? JSON.parse(r.value) : []; }catch(e){ return []; }
}

async function addPendingBoost(id){
  const boosts = await getPendingBoosts();
  boosts.push(id);
  try{ await window.storage.set('pendingBoosts', JSON.stringify(boosts), false); }catch(e){}
}

async function clearPendingBoosts(){
  try{ await window.storage.delete('pendingBoosts', false); }catch(e){}
}

function applyStartingBoosts(boostIds){
  const capped = boostIds.slice(0, 2);
  capped.forEach(id=>{
    if(id==='ratings'){ Object.keys(S.ratings).forEach(k=> S.ratings[k]=clamp(S.ratings[k]+3,20,99)); }
    else if(id==='money'){ S.finance.careerEarnings = Math.round((S.finance.careerEarnings+3)*10)/10; }
    else if(id==='confidence'){ S.confidence = clamp(S.confidence+15,0,100); }
    else if(id==='draftstock'){ S.draftStock += 6; }
    else if(id==='reputation'){ S.reputation = clamp((S.reputation||55)+15,0,100); }
  });
}

async function loadBoostShop(){
  const points = await getCareerPoints();
  const pending = await getPendingBoosts();
  const atCap = pending.length >= 2;
  const boosts = STARTING_BOOSTS.map(b => LANG==='en' ? {...b, ...STARTING_BOOSTS_EN[b.id]} : b);
  const copy = LANG==='en' ? {
    eyebrow:'🛒 Starting Boosts Shop', pts:(p)=>`${p} career point${p>1?'s':''} available`,
    desc:'Every completed career earns you points (based on your legacy score). Spend them to give your <strong>next</strong> career a boost. Max 2 boosts per career.',
    alreadyPlanned:(list)=>`✅ Already planned for your next career: ${list}`,
    capReached:'You\u2019ve reached the 2-boost limit for your next career.'
  } : {
    eyebrow:'🛒 Boutique de départ', pts:(p)=>`${p} point${p>1?'s':''} de carrière disponible${p>1?'s':''}`,
    desc:'Chaque carrière terminée te rapporte des points (selon ton score de légende). Dépense-les pour donner un coup de pouce à ta <strong>prochaine</strong> carrière. Maximum 2 boosts par carrière.',
    alreadyPlanned:(list)=>`✅ Déjà prévu pour ta prochaine carrière : ${list}`,
    capReached:'Tu as atteint la limite de 2 boosts pour ta prochaine carrière.'
  };
  app.innerHTML = `
  <div class="card">
    <p class="eyebrow">${copy.eyebrow}</p>
    <h2>${copy.pts(points)}</h2>
    <p class="muted">${copy.desc}</p>
    ${pending.length ? `<p class="muted">${copy.alreadyPlanned(pending.map(id=>boosts.find(b=>b.id===id).label).join(', '))}</p>` : ''}
    ${atCap ? `<p class="muted" style="color:var(--red);">🚫 ${copy.capReached}</p>` : ''}
    <div class="choice-row single" id="shopRow">
      ${boosts.map(b=>`
        <button class="choice-btn" data-id="${b.id}" ${(b.cost>points || atCap)?'disabled':''}>
          <span class="opt-title">${b.label} — ${b.cost} pts</span>
          <span class="opt-sub">${b.sub}</span>
        </button>`).join('')}
    </div>
    <button class="btn-primary" id="shopBackBtn" style="margin-top:14px;">${t('backHome')}</button>
  </div>`;
  document.querySelectorAll('#shopRow .choice-btn').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const boost = STARTING_BOOSTS.find(x=>x.id===b.dataset.id);
      const ok = await spendCareerPoints(boost.cost);
      if(ok){ await addPendingBoost(boost.id); }
      loadBoostShop();
    });
  });
  document.getElementById('shopBackBtn').addEventListener('click', screenOrigin);
}

async function renderLegends(){
  const wrap = document.getElementById('legendsWrap');
  if(!wrap) return;
  try{
    const list = await window.storage.list('career:', false);
    if(!list || !list.keys || list.keys.length===0) return;
    const allKeys = list.keys;
    const recentKeys = allKeys.slice(-8).reverse();
    const items = [];
    for(const k of allKeys){
      try{ const r = await window.storage.get(k, false); if(r) items.push(JSON.parse(r.value)); }catch(e){}
    }
    if(items.length===0) return;
    window._pastCareers = items;
    const recentItems = recentKeys.map(k=>items.find(it=>('career:'+it.date)===k)).filter(Boolean);
    wrap.className = 'card';
    wrap.innerHTML = `
      <h3>${t('legendsHall')} <span class="muted" style="font-family:'Inter',sans-serif;text-transform:none;letter-spacing:0;font-size:12px;">${t('clickToViewSummary')}</span></h3>
      ${recentItems.map(c=>{
        const a = c.awards||{};
        const trophyBits = [];
        if(a.mvp) trophyBits.push(`👑${a.mvp} MVP`);
        if(a.dpoy) trophyBits.push(`🛡️${a.dpoy} DPOY`);
        if(a.allStar) trophyBits.push(`⭐${a.allStar} AS`);
        if(a.champ) trophyBits.push(`🏆${a.champ} Titre${a.champ>1?'s':''}`);
        if(a.finalsMvp) trophyBits.push(`🎖️${a.finalsMvp} FMVP`);

      <div class="legend-card" data-date="${c.date}" style="cursor:pointer;">

// Compare this freshly finished career to every past saved career, so the player can see
// how it stacks up against their own history.
async function compareToPastCareers(legacy){
  try{
    const list = await window.storage.list('career:', false);
    if(!list || !list.keys || list.keys.length===0) return;
    const items = [];
    for(const k of list.keys){
      try{ const r = await window.storage.get(k, false); if(r) items.push(JSON.parse(r.value)); }catch(e){}
    }
    // On exclut la carrière qu'on vient tout juste de sauvegarder pour ne comparer qu'aux précédentes.
    const previous = items.filter(it => it.name!==S.name || it.number!==S.number || Math.abs(it.date - (window._lastSavedAt||0)) > 2000);
    if(previous.length===0) return;
    const worse = previous.filter(it => it.legacy < legacy).length;
    const percentile = Math.round(100*worse/previous.length);
    const wrap = document.getElementById('rankWrap');
    if(!wrap) return;
    wrap.className = 'card';
    const copy = LANG==='en' ? {
      eyebrow:'📊 Comparison with your past careers',
      title:percentile===100 ? 'Best career of all your simulated fates 🏆' : `Better career than ${percentile}% of your simulated fates`,
      desc: worse===previous.length ? "This is officially your best career yet!" : worse===0 ? "Your previous careers were all better — there's room to grow." : `Based on legacy score (${legacy} for this career, compared to ${previous.length} previous career${previous.length>1?'s':''}).`
    } : {
      eyebrow:'📊 Comparaison avec tes anciennes carrières',
      title:percentile===100 ? 'Meilleure carrière que 100% de tes destins simulés 🏆' : `Meilleure carrière que ${percentile}% de tes destins simulés`,
      desc: worse===previous.length ? "C'est officiellement ta meilleure carrière à ce jour !" : worse===0 ? "Tes carrières précédentes étaient toutes meilleures — il y a de la marge pour progresser." : `Basé sur le score de légende (${legacy} pour cette carrière, comparé à ${previous.length} carrière${previous.length>1?'s':''} précédente${previous.length>1?'s':''}).`
    };
    wrap.innerHTML = `
      <p class="eyebrow">${copy.eyebrow}</p>
      <h2>${copy.title}</h2>
      <p class="muted">${copy.desc}</p>`;
  }catch(e){ /* stockage indisponible */ }
}

async function checkAndUpdateRecords(){
  try{
    let records = {};
    try{
      const r = await window.storage.get('records', false);
      records = r ? JSON.parse(r.value) : {};
    }catch(e){ records = {}; }
    const c = S.career;
    const broken = [];
    const bestSeasonPts = S.log.length ? Math.max(...S.log.map(l=>l.points)) : 0;
    const liveValues = {
      points:c.points, rebounds:c.rebounds, assists:c.assists, seasons:c.seasons, champs:S.awards.champ,
      legacy:computeLegacy(), allStar:S.awards.allStar, fortune:S.finance.careerEarnings,
      bestSeasonPts:Math.round(bestSeasonPts*10)/10, bestGamePoints:S._careerBestGamePoints||0,
      playoffPoints:S.playoffCareer.points,
      overseasTitles:(S.overseas&&S.overseas.titles)||0, mvpCount:S.awards.mvp
    };
    const checks = RECORD_DEFS.map(d=> ({...d, value:liveValues[d.key]}));
    checks.forEach(chk=>{
      const prev = records[chk.key];
      if(chk.value > 0 && (!prev || chk.value > prev.value)){
        records[chk.key] = {value:chk.value, name:S.name, date:Date.now()};
        broken.push(chk);
      }
    });
    if(broken.length){
      try{ await window.storage.set('records', JSON.stringify(records), false); }catch(e){}
      const wrap = document.getElementById('recordsWrap');
      if(wrap){
        wrap.className = 'card verdict-good';
        const bannerCopy = LANG==='en'
          ? {eyebrow:'🏆 New All-Time Record(s)', title:'You\u2019re making history!'}
          : {eyebrow:'🏆 Nouveau(x) record(s) all-time', title:"Tu entres dans l'histoire !"};
        wrap.innerHTML = `
          <p class="eyebrow">${bannerCopy.eyebrow}</p>
          <h2>${bannerCopy.title}</h2>
          <div>${broken.map(b=>`<span class="badge badge-gold">${recordLabel(b.key)} : ${b.value}</span>`).join('')}</div>`;
      }
    }
  }catch(e){ /* stockage indisponible, on ignore */ }
}

        <div class="trophy-item"><div class="tv">💰 ${fmtMoney(S.finance.careerEarnings)}</div><div class="tl">${t('statFortune')}</div></div>
      </div>
      <p style="text-align:center;color:#C9D3E4;font-size:12px;margin:10px 0 0;">${LANG==='en' ? `Career averages: ${ppg} PTS · ${rpg} REB · ${apg} AST` : `Moyennes carrière : ${ppg} PTS · ${rpg} REB · ${apg} PAS`}</p>
      <button class="btn-ghost" id="copyCardBtn" style="margin-top:14px;border-color:var(--gold);color:var(--gold);">📋 ${LANG==='en'?'Copy this summary':'Copier ce résumé'}</button>
    </div>
    ${S.draftClass && S.draftClass.length ? `
    <div class="card">
      <p class="eyebrow">🎓 ${LANG==='en'?'Your Draft Class Ranking':'Classement de ta draft class'}</p>
      <h2>${LANG==='en'?'Who Had the Best Career?':'Qui a eu la meilleure carrière ?'}</h2>
      <table class="boxscore">
        <tr><th>${LANG==='en'?'Rank':'Rang'}</th><th>${LANG==='en'?'Name':'Nom'}</th><th>Score</th><th>MVP</th><th>${LANG==='en'?'Titles':'Titres'}</th><th>All-Star</th></tr>
        ${(()=>{
          const meRow = {name:`${S.name} (${LANG==='en'?'you':'toi'})`, score:legacy, mvps:S.awards.mvp, champs:S.awards.champ, allStars:S.awards.allStar};
          const rows = S.draftClass.map(p=>({name:p.name, score:Math.round(p.ov*4), mvps:p.mvps, champs:p.champs, allStars:p.allStars}));
          rows.push(meRow);
          rows.sort((a,b)=>b.score-a.score);
          return rows.map((r,i)=>`<tr${r.name.includes(LANG==='en'?'(you)':'(toi)')?' style="font-weight:700;background:var(--paper-2);"':''}><td>#${i+1}</td><td>${r.name}</td><td>${r.score}</td><td>${r.mvps}</td><td>${r.champs}</td><td>${r.allStars}</td></tr>`).join('');
        })()}
      </table>
      <p class="muted">${(()=>{
        const meScore = legacy;
        const allScores = S.draftClass.map(p=>Math.round(p.ov*4));
        const rank = allScores.filter(s=>s>meScore).length + 1;
        if(LANG==='en') return rank===1 ? "You finish #1 in your draft class — the best player of your generation." : `You finish #${rank} out of ${S.draftClass.length+1} in your draft class.`;
        return rank===1 ? "Tu termines n°1 de ta classe de draft — le meilleur joueur de ta promotion." : `Tu termines n°${rank} sur ${S.draftClass.length+1} de ta classe de draft.`;
      })()}</p>
    </div>` : ''}
    <h3>🎖️ ${LANG==='en'?'Career Badges':'Badges de carrière'}</h3>
    <div>
      ${badges.map(b=>`<span class="badge badge-navy">${badgeLabel(b)}</span>`).join('')}
    </div>
  </div>
  <div class="card">
    <p class="eyebrow">📖 ${LANG==='en'?'Career Log':'Carnet de carrière'}</p>
    <h2>${LANG==='en'?'Season by Season':'Saison par saison'}</h2>
    ${renderSeasonLog()}
    ${(S.awards.worldCupGold||S.awards.worldCupMedal||S.awards.olympicGold||S.awards.olympicMedal) ? `
    <h3>${LANG==='en'?'International Achievements':'Palmarès international'}</h3>
    <div>
      ${S.awards.olympicGold? `<span class="badge badge-gold">🥇 ${S.awards.olympicGold}x ${LANG==='en'?'Olympic Gold':'Or Olympique'}</span>`:''}
      ${S.awards.olympicMedal? `<span class="badge badge-navy">🥈 ${S.awards.olympicMedal}x ${LANG==='en'?'Olympic Medal':'Médaille JO'}</span>`:''}
      ${S.awards.worldCupGold? `<span class="badge badge-gold">🥇 ${S.awards.worldCupGold}x ${LANG==='en'?'FIBA World Champion':'Champion du Monde FIBA'}</span>`:''}
      ${S.awards.worldCupMedal? `<span class="badge badge-navy">🥈 ${S.awards.worldCupMedal}x ${LANG==='en'?'World Cup Medal':'Médaille Coupe du Monde'}</span>`:''}
    </div>` : ''}
    <p class="eyebrow" style="margin-top:14px;">${LANG==='en'?'Achievements':'Palmarès'}</p>
    <h2>${c.seasons} ${LANG==='en'?'NBA seasons':'saisons en NBA'}</h2>
    ${renderCareerMini()}
    <h3>${LANG==='en'?'Career Averages':'Moyennes de carrière'}</h3>
    <table class="boxscore">
      <tr><th>PTS</th><th>REB</th><th>AST</th><th>${LANG==='en'?'Games Played':'Matchs joués'}</th></tr>
      <tr><td>${ppg}</td><td>${rpg}</td><td>${apg}</td><td>${c.games}</td></tr>
    </table>
    ${S.overseas && S.overseas.seasons>0 ? `
    <h3>✈️ ${LANG==='en'?'Overseas Career':"Carrière à l'étranger"}</h3>
    <p class="muted">${S.overseas.seasons} ${LANG==='en' ? (S.overseas.seasons>1?'seasons':'season') : (S.overseas.seasons>1?'saisons':'saison')} ${LANG==='en'?'in':'en'} ${S.overseas.league} · 🏆 ${S.overseas.titles} ${LANG==='en' ? (S.overseas.titles>1?'titles':'title') : (S.overseas.titles>1?'titres':'titre')} · ⭐ ${S.overseas.mvps} MVP</p>` : ''}
    <h3>🏅 ${LANG==='en'?'Playoff Record':'Bilan en playoffs'}</h3>
    <p class="muted">${S.playoffCareer.appearances} ${LANG==='en' ? (S.playoffCareer.appearances>1?'appearances':'appearance') : ('participation'+(S.playoffCareer.appearances>1?'s':''))} · ${LANG==='en'?'best run':'meilleur parcours'} : <strong>${S.playoffCareer.bestDepth<0 ? (LANG==='en'?'Never qualified':'Jamais qualifié') : playoffResultLabel(S.playoffCareer.bestDepth)}</strong></p>
    ${S.playoffCareer.games>0 ? `
    <table class="boxscore">
      <tr><th>PTS/g</th><th>REB/g</th><th>AST/g</th><th>${LANG==='en'?'Playoff Games':'Matchs de playoffs'}</th></tr>
      <tr>
        <td>${(S.playoffCareer.points/S.playoffCareer.games).toFixed(1)}</td>
        <td>${(S.playoffCareer.rebounds/S.playoffCareer.games).toFixed(1)}</td>
        <td>${(S.playoffCareer.assists/S.playoffCareer.games).toFixed(1)}</td>
        <td>${S.playoffCareer.games}</td>
      </tr>
    </table>` : ''}
    <h3>${LANG==='en'?'Distinctions':'Distinctions'}</h3>
    <div>
      ${S.awards.allStar? `<span class="badge badge-gold">⭐ ${S.awards.allStar}x All-Star</span>`:''}
      ${S.awards.mvp? `<span class="badge badge-red">👑 ${S.awards.mvp}x MVP</span>`:''}
      ${S.awards.dpoy? `<span class="badge badge-navy">🛡️ ${S.awards.dpoy}x DPOY</span>`:''}
      ${S.awards.champ? `<span class="badge badge-gold">🏆 ${S.awards.champ}x Champion</span>`:''}
      ${S.awards.finalsMvp? `<span class="badge badge-red">🎖️ ${S.awards.finalsMvp}x Finals MVP</span>`:''}
      ${S.awards.roty? `<span class="badge badge-navy">🌱 ${LANG==='en'?'Rookie of the Year':"Rookie de l'année"}</span>`:''}
      ${(!S.awards.allStar && !S.awards.mvp && !S.awards.dpoy && !S.awards.champ && !S.awards.roty) ? `<span class="muted">${LANG==='en'?'A role-player career, quiet but honest.':'Une carrière de rôle, discrète mais honnête.'}</span>`:''}
    </div>
    <h3>💰 ${LANG==='en'?'What You Earned':'Ce que tu as gagné'}</h3>
    <table class="boxscore">
      <tr><th>${LANG==='en'?'Net career total':'Cumul net carrière'}</th><th>${LANG==='en'?'incl. endorsements':'dont sponsoring'}</th><th>${LANG==='en'?'incl. agent fees':"dont frais d'agent"}</th><th>${LANG==='en'?'incl. lifestyle':'dont train de vie'}</th></tr>
      <tr><td>${fmtMoney(S.finance.careerEarnings)}</td><td>${fmtMoney(S.finance.careerEndorsements)}</td><td>${fmtMoney(S.finance.agentFees||0)}</td><td>${fmtMoney(S.finance.livingCosts||0)}</td></tr>
    </table>
    <p class="muted" style="margin-top:14px;">${LANG==='en'?'Legacy score':'Score de légende'} : <strong>${legacy}</strong>${isHOF ? (LANG==='en'?' — Hall of Fame threshold crossed.':' — seuil du Hall of Fame franchi.') : (LANG==='en'?' — Hall of Fame threshold: 350.':' — seuil du Hall of Fame : 350.')}</p>
    <div class="event-box" style="text-align:center;">
      <p style="margin:0;font-family:'Anton',sans-serif;font-size:34px;color:var(--navy);">${LANG==='en'?'Career Grade':'Note de carrière'} : ${grade.grade}</p>
      <p class="muted" style="margin:2px 0 0;">${grade.label}</p>
    </div>
    <button class="btn-primary" id="restartBtn">${LANG==='en'?'Start a New Career':'Commencer une nouvelle carrière'}</button>
  </div>`;
  document.getElementById('restartBtn').addEventListener('click', screenOrigin);
  const copyBtn = document.getElementById('copyCardBtn');
  if(copyBtn){
    copyBtn.addEventListener('click', ()=>{
      const rankHeading = document.querySelector('#rankWrap h2');
      const recordsHeading = document.querySelector('#recordsWrap h2');
      const recordsList = document.querySelector('#recordsWrap div');
      let summary = `🏀 ${S.name} #${S.number} (${posLabel(S.position)})\n`
        + (LANG==='en'
          ? `${c.seasons} seasons · Grade ${grade.grade} (${grade.label}) · Legacy score ${legacy}\n`
          : `${c.seasons} saisons · Note ${grade.grade} (${grade.label}) · Score de légende ${legacy}\n`)
        + `⭐ ${S.awards.allStar} All-Star · 🛡️ ${S.awards.dpoy} DPOY · 👑 ${S.awards.mvp} MVP · 🎖️ ${S.awards.finalsMvp} Finals MVP\n`
        + (LANG==='en'
          ? `🏆 ${S.awards.champ} NBA title(s) · 🌏 ${(S.overseas&&S.overseas.titles)||0} overseas title(s) · 🌍 ${(S.awards.worldCupGold||0)+(S.awards.olympicGold||0)} international title(s)\n`
          : `🏆 ${S.awards.champ} titre(s) NBA · 🌏 ${(S.overseas&&S.overseas.titles)||0} titre(s) overseas · 🌍 ${(S.awards.worldCupGold||0)+(S.awards.olympicGold||0)} titre(s) international(aux)\n`)
        + (LANG==='en' ? `Career averages: ${ppg} PTS, ${rpg} REB, ${apg} AST\n` : `Moyennes carrière : ${ppg} PTS, ${rpg} REB, ${apg} PAS\n`);
      if(rankHeading) summary += `📊 ${rankHeading.textContent}\n`;
      if(recordsHeading) summary += `🏆 ${recordsHeading.textContent}${recordsList ? ' : '+recordsList.textContent.trim() : ''}\n`;
      summary += `— Hoop Dynasty`;
      const done = ()=>{ copyBtn.textContent = LANG==='en' ? '✅ Copied!' : '✅ Copié !'; setTimeout(()=>{ copyBtn.textContent = LANG==='en' ? '📋 Copy this summary' : '📋 Copier ce résumé'; }, 2000); };
      try{
        navigator.clipboard.writeText(summary).then(done).catch(()=>{ copyBtn.textContent = LANG==='en' ? '⚠️ Copy unavailable' : '⚠️ Copie indisponible'; });
      }catch(e){ copyBtn.textContent = LANG==='en' ? '⚠️ Copy unavailable' : '⚠️ Copie indisponible'; }
    });
  }
  checkAndUpdateRecords();
}

document.getElementById('langSwitcher').outerHTML = renderLangSwitcher();
screenOrigin();
</script>
</body>
</html>
